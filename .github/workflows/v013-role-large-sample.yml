name: Wanderer v0.13 native role large-sample campaign (no deploy)

on:
  pull_request:
    paths:
      - 'scripts/simulate-progression.cjs'
      - 'tests/v013-role-affinity-matrix.test.cjs'
      - '.github/workflows/v013-role-large-sample.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-role-cohorts:
    name: ${{ matrix.affinity }} / ${{ matrix.loadout }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        affinity: [blood, decay, radiance, aegis, fury, magic]
        loadout: [starter, equipped]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run native 144-case affinity cohort
        shell: bash
        run: |
          if [ "${{ matrix.loadout }}" = "starter" ]; then
            POINTS=0
            RUNES=false
            RARITY=Common
          else
            POINTS=24
            RUNES=true
            RARITY=Rare
          fi
          node scripts/simulate-progression.cjs \
            --mode=roles --levels=1 --seeds=9101,9201,9301 \
            --builds=blood-fury,aegis-radiance,arcane-decay \
            --affinities=${{ matrix.affinity }} \
            --group-sizes=1,4,12,20 \
            --role-effects=baseline,trait,condition,both \
            --points="$POINTS" --runes="$RUNES" --rarity="$RARITY" \
            --tick-limit=4500 \
            --out=reports/role-cohort-${{ matrix.affinity }}-${{ matrix.loadout }}.json > cohort-output.txt
      - name: Summarize cohort and report failures
        if: always()
        env:
          AFFINITY: ${{ matrix.affinity }}
          LOADOUT: ${{ matrix.loadout }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='reports/role-cohort-'+process.env.AFFINITY+'-'+process.env.LOADOUT+'.json';
          if(!fs.existsSync(p)){console.error('Missing report',p);process.exit(1);}
          const d=JSON.parse(fs.readFileSync(p,'utf8')),rows=d.rows;
          const distinct=k=>[...new Set(rows.map(r=>r[k]).filter(x=>x!=null))].sort();
          const usable=rows.filter(r=>!r.error&&!r.timedOut),mean=(a,k)=>a.length?+(a.reduce((n,r)=>n+(Number(r[k])||0),0)/a.length).toFixed(2):null;
          const byEffect=Object.fromEntries(distinct('roleEffect').map(effect=>{const a=rows.filter(r=>r.roleEffect===effect);return [effect,{cases:a.length,wins:a.filter(x=>x.won).length,errors:a.filter(x=>x.error).length,timeouts:a.filter(x=>x.timedOut).length,damageTaken:mean(a.filter(x=>!x.error),'damageTaken'),seconds:mean(a.filter(x=>!x.error),'seconds')}] }));
          const out={affinity:process.env.AFFINITY,loadout:process.env.LOADOUT,cases:rows.length,valid:usable.length,wins:rows.filter(x=>x.won).length,errors:rows.filter(x=>x.error).length,timeouts:rows.filter(x=>x.timedOut).length,groupSizes:distinct('requestedGroupSize'),roles:distinct('roleEffect'),abilities:[...new Set(rows.flatMap(r=>(r.roster||[]).map(x=>x.ability).filter(Boolean)))].sort(),byEffect,firstErrors:rows.filter(x=>x.error).slice(0,5).map(x=>({seed:x.seed,kind:x.kind,error:x.error}))};
          console.log('COHORT_SUMMARY '+JSON.stringify(out));
          fs.writeFileSync(p.replace('.json','-summary.json'),JSON.stringify(out,null,2)+'\n');
          if(out.errors||out.cases!==144)process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: role-cohort-${{ matrix.affinity }}-${{ matrix.loadout }}
          path: reports/role-cohort-${{ matrix.affinity }}-${{ matrix.loadout }}*.json
          if-no-files-found: warn

name: v0.13 B1.2C.2 - agent decision quality
on:
  push:
    branches: [balance/b1.2c2-agent-decision-quality]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/v013-b12c2-agent-decision.test.cjs tests/v013-b12c1-attunement.test.cjs tests/v013-stage648c1-identity.test.cjs tests/v013-natural-progression.test.cjs tests/v013-strategic-build-agents.test.cjs tests/v013-s4-agent-consistency.test.cjs tests/v013-b12c-surrender.test.cjs
  audit:
    needs: regression
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v013-b12c2-agent-decision-audit.cjs ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b12c2-shard-${{ matrix.shard }}
          path: reports/b12c2/shard-${{ matrix.shard }}.json
          if-no-files-found: error
  aggregate:
    needs: audit
    if: always() && needs.audit.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: b12c2-shard-*
          merge-multiple: true
          path: reports/b12c2
      - run: node scripts/v013-b12c2-agent-decision-audit.cjs aggregate
      - name: Download exact B1.2C.1 baseline (no rerun)
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: b12c1-summary
          github-token: ${{ github.token }}
          run-id: 45900893818
          path: baseline
      - name: Compare paired account seeds
        if: always()
        run: node scripts/v013-b12c2-agent-decision-audit.cjs compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b12c2-summary
          path: |
            reports/b12c2/summary.json
            reports/b12c2/comparison.json
          if-no-files-found: warn

name: Wanderer Stage 6.21 — Naturally earned Boss E5-E15 evidence (NO DEPLOY)
on:
  push:
    branches:
      - audit/v013-stage621-natural-e1-recovery-20261121
    paths:
      - '.github/workflows/v013-stage621-earned-e15.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  earned-native:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.5', cache: npm}
      - run: npm ci
      - name: Validate true native account invariants and six Boss changes
        run: |
          node --test tests/v013-natural-progression.test.cjs tests/v013-stage621-natural-recovery.test.cjs
          node --test tests/v013-stage84-six-bosses.test.cjs tests/v013-boss-preparation-runtime.test.cjs
          git diff --check
      - name: Native earned E1 through E15 attempts, no forced unlocks, gear, XP or loot
        run: node scripts/v013-natural-progression.cjs --seeds=9701,9702 --profiles=cautious,balanced --max-level=15 --max-attempts=18 --max-total-attempts=100 --tick-limit=4500 --out=reports/v013-stage621-earned-e1-e15.json
      - name: Preserve full real gear, Boss, Talent, potion and expedition history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage621-real-native-earned-e1-to-e15-accounts
          path: |
            reports/v013-stage621-earned-e1-e15.json
            reports/v013-stage621-earned-e1-e15.md
          retention-days: 30
          if-no-files-found: warn

name: Wanderer v0.13 Stage 9.5 - controlled native Elite vs Tank (no deploy)
on:
  push:
    branches: [feature/v013-stage95-elite-threat-20261118]
  workflow_dispatch:
jobs:
  elite-threat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native Tank vs Elite fixture tests
        run: |
          node --test tests/v013-stage95-elite-parity.test.cjs
          npm run test:v013:human-decisions
          npm run test:v013:natural
          node --test tests/v013-stage82-elite-abilities.test.cjs
          node --test tests/v013-stage81-enemy-abilities.test.cjs
          node --test tests/v013-full-expedition-integration.test.cjs
          npm run test:v013:balance
      - name: E1 starter and Common matched-seed Tank vs Elite diagnostic
        run: node scripts/v013-elite-tank-parity.cjs --scan=130 --pairs=24 --out=reports/v013-stage95-elite-parity.json
      - name: Natural earned-account E1-E8 regression with tougher native Elites
        run: node scripts/v013-natural-progression.cjs --seeds=9304 --profiles=cautious,balanced --max-attempts=12 --out=reports/v013-stage95-natural-e1-e8.json
      - name: Upload controlled reports, no site deployment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v013-stage95-elite-tank-parity
          path: |
            reports/v013-stage95-elite-parity.json
            reports/v013-stage95-elite-parity.md
            reports/v013-stage95-natural-e1-e8.json
            reports/v013-stage95-natural-e1-e8.md
          if-no-files-found: warn

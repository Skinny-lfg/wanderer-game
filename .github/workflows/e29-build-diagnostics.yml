name: E.2.9 Build initial stats and potion diagnostic
on:
  push:
    branches: [development]
    paths: [.github/workflows/e29-build-diagnostics.yml]
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 450 persistent diagnostic Expeditions
        env:
          WANDERER_E11_RUNS: '450'
        run: node scripts/v012-phase-e29-build-diagnostics.cjs /tmp/e29.json
      - name: Analyze starting stats and actual potion activation
        run: |
          node - <<'NODE'
          const d=require('/tmp/e29.json');
          for(const build of ['Archer','Mage','Battlemage','Tank','Assassin']){
            const a=d.agents.filter(x=>x.buildName===build&&x.profile==='base');
            console.log('E29_STATS '+JSON.stringify({build,initial:a.map(x=>({power:x.initialStats.power,attack:x.initialStats.attack,defense:x.initialStats.defense,hp:x.initialStats.hp,magic:x.initialStats.spellPower,evasion:x.initialStats.evasionRating,block:x.initialStats.blockChance,weapon:x.initial.equip.weapon?.subtype,offhand:x.initial.equip.offhand?.subtype,armor:['helm','armor','gloves','belt','boots'].map(slot=>x.initial.equip[slot]?.armorType)}))}));
            for(const plan of ['adapted','fortune']){
              const rows=d.rows.filter(x=>x.buildName===build&&x.profile===plan);
              const used={};for(const r of rows)for(const u of r.potionsUsed||[])used[u.kind]=(used[u.kind]||0)+1;
              const selected={};for(const r of rows)for(const k of r.selected||[])selected[k]=(selected[k]||0)+1;
              const missing={};for(const r of rows)for(const k of r.missing||[])missing[k]=(missing[k]||0)+1;
              console.log('E29_POTIONS '+JSON.stringify({build,plan,runs:rows.length,wins:rows.filter(x=>x.win).length,selected,missing,used,empty:rows.filter(x=>!x.selected.length).length,full:rows.filter(x=>x.selected.length===3).length,spent:rows.reduce((n,x)=>n+x.potionGold+x.potionRefreshGold,0)}));
            }
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wanderer-e29-diagnostic
          path: /tmp/e29.json
          if-no-files-found: ignore

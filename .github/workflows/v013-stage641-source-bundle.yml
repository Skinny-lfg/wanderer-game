name: Stage 6.41 — native simulator source snapshot (NO DEPLOY)
on:
  push:
    branches: [balance/stage-6.40-e1-calibration]
    paths:
      - '.github/workflows/v013-stage641-source-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Archive tested source files only, excluding user data and credentials
        run: |
          git archive --format=zip --output=/tmp/stage641-native-source.zip HEAD combat economy online scripts tests index.html package.json package-lock.json
          unzip -t /tmp/stage641-native-source.zip | tail -1
          sha256sum /tmp/stage641-native-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stage641-native-source
          path: /tmp/stage641-native-source.zip
          retention-days: 7

name: E.3.6 Offhand progression
on:
  push:
    branches: [development]
    paths: [.github/workflows/e36-offhand-progression.yml]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 1200 progression comparisons
        run: node scripts/v012-phase-e36-offhand-progression.cjs /tmp/e36.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e36-progression-results
          path: /tmp/e36.json
          if-no-files-found: ignore

name: E.3.4 Dot and proc normalization
on:
  push:
    branches: [development]
    paths: [.github/workflows/e34-dot-normalization.yml]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 180 normalized combat experiments
        run: node scripts/v012-phase-e34-dot-normalization.cjs /tmp/e34.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e34-results
          path: /tmp/e34.json
          if-no-files-found: ignore

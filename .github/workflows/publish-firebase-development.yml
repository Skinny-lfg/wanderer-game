name: Publish Wanderer v0.12 to development Firebase Hosting

on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wanderer-development-hosting
  cancel-in-progress: false

jobs:
  deploy:
    # Never deploy on ordinary pushes. An explicit deploy-marker commit is required.
    if: ${{ github.ref == 'refs/heads/development' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[firebase-dev-deploy]')) }}
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 25
    steps:
      - name: Checkout development
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Build Firebase SDK bundle
        run: npm run build:firebase

      - name: Run focused save and potion regressions
        run: node --test tests/v012-save.test.mjs tests/v012-complete-potions.test.cjs

      - name: Prepare safe development-only website
        env:
          FIREBASE_PROJECT_ID: wanderer-development-8e3ee
        run: node scripts/prepare-hosting-development.mjs

      - name: Prepare Hosting-only settings on this runner (no Firestore deploy)
        run: |
          cat > firebase.json <<'JSON'
          {
            "hosting": {
              "public": "hosting-dist",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "headers": [
                { "source": "**/*.html", "headers": [{ "key": "Cache-Control", "value": "no-cache, max-age=0, must-revalidate" }] },
                { "source": "/online/firebase-config.mjs", "headers": [{ "key": "Cache-Control", "value": "no-store" }] }
              ]
            }
          }
          JSON

      - name: Verify dedicated development service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WANDERER_DEVELOPMENT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_WANDERER_DEVELOPMENT GitHub secret"
            exit 1
          fi
          node --input-type=module -e "const c=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);if(c.type!=='service_account'||c.project_id!=='wanderer-development-8e3ee')throw Error('Wrong development service account project')"

      - name: Deploy development Hosting only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WANDERER_DEVELOPMENT }}
          projectId: wanderer-development-8e3ee
          channelId: live

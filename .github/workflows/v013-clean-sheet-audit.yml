name: Wanderer audit — Clean sheet dependency and obsolete-code scan (no deploy)
# Revalidate source after deleting retired UI and v9-v14 talent migrator.

on:
  push:
    branches:
      - audit/v013
    paths:
      - '.github/workflows/v013-clean-sheet-audit.yml'
      - 'combat/**'
      - 'economy/**'
      - 'online/**'
      - 'scripts/prepare-automatic-preview.mjs'
      - 'tests/v013-c2-reset.test.cjs'
      - 'tests/v0120-evasion.test.cjs'
      - 'tests/v013-c3-*.cjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-current-game:
    if: github.ref == 'refs/heads/audit/v013'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate broad static reachability and migration audit
        run: node scripts/v013-clean-sheet-audit.cjs
      - name: Establish current save and talent regression baseline
        run: >-
          node --test
          tests/v013-dead-talent-cleanup.test.cjs
          tests/v013-clean-sheet-treasures.test.cjs
          tests/talent-graph-runtime.test.cjs
          tests/v013-c1-catalog-equivalence.test.cjs
          tests/v013-c2-reset.test.cjs
          tests/v013-talent-structure.test.cjs
          tests/v013-current-dungeon-and-talents.test.cjs
          tests/v013-stage7-contracts.test.cjs
          tests/v012-save.test.mjs
          tests/v013-stage5-build-audit.test.cjs
      - name: C3 root CSS and modern UI reachability guards
        run: npm run test:v013:c3:static
      - name: Current native talent graph regression suite
        run: npm run test:v013:talent-graph
      - name: C2 current crafting, contracts, gear, checkpoints and cloud reset
        run: npm run test:v013:c2
      - name: Historical v0.12 treasure tests (diagnostic only)
        continue-on-error: true
        run: node --test tests/v012-phase-c3-treasures.test.cjs
      - name: Build Pages preview locally and identify source-to-docs drift (no deploy)
        run: |
          npm run build:pages
          mkdir -p reports
          git status --short docs > reports/v013-pages-generated-drift.txt
          echo "DOCS_CHANGED_PATHS=$(wc -l < reports/v013-pages-generated-drift.txt)"
          git diff --stat -- docs | tail -25 || true
      - name: Record exact source provenance
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF}"
            echo "node=$(node --version)"
            sha256sum combat/talent-catalog.js combat/talent-graph-runtime.js combat/automatic-talents.js online/v012-save.js index.html
          } > reports/v013-clean-sheet-audit-provenance.txt
      - name: Store candidate audit and details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v013-clean-sheet-static-audit
          path: |
            reports/v013-clean-sheet-audit.json
            reports/v013-clean-sheet-audit.md
            reports/v013-clean-sheet-audit-provenance.txt
            reports/v013-pages-generated-drift.txt
          if-no-files-found: warn
          retention-days: 30

  browser-clean-sheet:
    if: github.ref == 'refs/heads/audit/v013'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Find installed Chrome or provision Playwright Chromium
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$CHROME_BIN" ]; then
            echo "CHROMIUM_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
            "$CHROME_BIN" --version
          else
            npx playwright install chromium
          fi
      - name: Verify v15 Talents, Forge, Inventory, Dungeon and responsive UI in Chromium
        run: npm run test:v013:browser
      - name: Store C3 desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v013-c3-responsive-browser
          path: reports/v013-c3-browser/
          if-no-files-found: warn
          retention-days: 14

  sync-generated-pages:
    # Commit only to the isolated audit branch, after native and real-browser tests.
    # No Pages action, deployment, pull request merge or production data mutation.
    if: github.ref == 'refs/heads/audit/v013' && github.repository == 'Skinny-lfg/wanderer-game'
    needs: [scan-current-game, browser-clean-sheet]
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v013
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate canonical isolated Pages mirror
        run: npm run build:pages
      - name: Commit generated docs to audit branch only (no deploy)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/audit/v013"
          git add -A docs
          echo "C3_GENERATED_DOC_PATHS=$(git diff --cached --name-only -- docs | wc -l)"
          if git diff --cached --quiet -- docs; then
            echo "C3_DOCS_ALREADY_IN_SYNC=true"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "build(C3): synchronize generated Pages preview on audit branch [skip ci]"
            git push origin HEAD:refs/heads/audit/v013
          fi
      - name: Confirm Pages generator is deterministic after sync
        shell: bash
        run: |
          npm run build:pages
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "::error::Pages generator is not reproducible against the committed docs tree"
            git status --short docs
            exit 1
          fi
          echo "C3_DOCS_SOURCE_PARITY=true"

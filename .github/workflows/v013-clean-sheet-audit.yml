name: Wanderer audit — Clean sheet dependency and obsolete-code scan (no deploy)
# Revalidate source after deleting retired UI and v9-v14 talent migrator.

on:
  push:
    branches:
      - audit/v013
    paths:
      - '.github/workflows/v013-clean-sheet-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-current-game:
    if: github.ref == 'refs/heads/audit/v013'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate broad static reachability and migration audit
        run: node scripts/v013-clean-sheet-audit.cjs
      - name: Establish current save and talent regression baseline
        run: >-
          node --test
          tests/v013-dead-talent-cleanup.test.cjs
          tests/v013-clean-sheet-treasures.test.cjs
          tests/talent-graph-runtime.test.cjs
          tests/v013-talent-structure.test.cjs
          tests/v013-current-dungeon-and-talents.test.cjs
          tests/v013-stage7-contracts.test.cjs
          tests/v012-save.test.mjs
          tests/v013-stage5-build-audit.test.cjs
      - name: Historical v0.12 treasure tests (diagnostic only)
        continue-on-error: true
        run: node --test tests/v012-phase-c3-treasures.test.cjs
      - name: Build Pages preview locally and identify source-to-docs drift (no deploy)
        run: |
          npm run build:pages
          mkdir -p reports
          git status --short docs > reports/v013-pages-generated-drift.txt
          echo "DOCS_CHANGED_PATHS=$(wc -l < reports/v013-pages-generated-drift.txt)"
          git diff --stat -- docs | tail -25 || true
      - name: Record exact source provenance
        if: always()
        shell: bash
        run: |
          mkdir -p reports
          {
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF}"
            echo "node=$(node --version)"
            sha256sum combat/talent-graph-runtime.js combat/automatic-talents.js online/v012-save.js index.html
          } > reports/v013-clean-sheet-audit-provenance.txt
      - name: Store candidate audit and details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v013-clean-sheet-static-audit
          path: |
            reports/v013-clean-sheet-audit.json
            reports/v013-clean-sheet-audit.md
            reports/v013-clean-sheet-audit-provenance.txt
            reports/v013-pages-generated-drift.txt
          if-no-files-found: warn
          retention-days: 30

  browser-clean-sheet:
    if: github.ref == 'refs/heads/audit/v013'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Find installed Chrome or provision Playwright Chromium
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$CHROME_BIN" ]; then
            echo "CHROMIUM_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
            "$CHROME_BIN" --version
          else
            npx playwright install chromium
          fi
      - name: Verify real browser uses v15 iframe and no old attribute controls
        run: node tests/v013-clean-sheet-browser.cjs

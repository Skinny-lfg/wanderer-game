name: Publish Wanderer to Firebase Hosting (manual)

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: 'Type wanderer-play to confirm the production Firebase project'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wanderer-firebase-production-hosting
  cancel-in-progress: false

jobs:
  deploy:
    # Never publish from development or from a different project.
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_project == 'wanderer-play' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Check out public release from main
        uses: actions/checkout@v4

      - name: Set up Node only on GitHub's runner
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build pinned Firebase client
        run: npm run build:firebase

      - name: Run release regressions
        run: npm test

      - name: Prepare allowlisted website and validate Firebase target
        env:
          FIREBASE_PROJECT_ID: wanderer-play
        run: node scripts/prepare-hosting.mjs

      - name: Check deployment credential is configured
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WANDERER_PLAY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_WANDERER_PLAY secret"
            exit 1
          fi

      - name: Publish Hosting only (never deploy Firestore rules)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WANDERER_PLAY }}
          projectId: wanderer-play
          channelId: live

name: Export playtest feedback to Drive
on:
  workflow_dispatch:
  schedule:
    - cron: '10 8 * * *'
concurrency:
  group: wanderer-feedback-export
  cancel-in-progress: false
jobs:
  export:
    if: vars.WANDERER_FEEDBACK_EXPORT_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false firebase-admin googleapis
      - name: Export feedback
        run: node scripts/export-feedback.mjs
        env:
          WANDERER_FEEDBACK_SERVICE_ACCOUNT_JSON: ${{ secrets.WANDERER_FEEDBACK_SERVICE_ACCOUNT_JSON }}
          WANDERER_FEEDBACK_SHEET_ID: ${{ secrets.WANDERER_FEEDBACK_SHEET_ID }}

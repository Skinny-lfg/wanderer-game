name: Wanderer Stage 6.33 — fixed enemy bases and stat-only calibration (NO DEPLOY)
on:
  push:
    branches: [balance/v013-stage633-fixed-enemy-bases-20261123]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stage633-fixed-bases
  cancel-in-progress: true
jobs:
  validate:
    name: Group parity, 8 Elites, 6 Bosses, native regression
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - name: Stage 6.33 exact stat-only native invariants
        run: |
          node --check combat/expedition-progression.js
          node --check combat/v012-combat-core.js
          node --check combat/v012-combat-runtime.js
          node --check online/v012-expedition-runtime.js
          node --check online/v013-enemy-roster.js
          node --test tests/v013-stage633-fixed-bases.test.cjs tests/v013-current-groups.test.cjs tests/v013-stage80-enemy-roster.test.cjs
          git diff --check
      - name: Full active v0.13 native regression
        run: npm test
      - name: Stage 6.33 native earned-account stat-only calibration smoke
        run: >-
          node scripts/v013-stage633-stat-only.cjs
          --seed=6331 --max-level=2 --max-attempts=6 --max-total-attempts=18
          --out=reports/v013-stage633-stat-only-smoke.json
      - name: Stage 6.32 ability-enabled live mode remains runnable
        run: >-
          node scripts/v013-stage632-player-power.cjs
          --mode=cohort --batch=0 --seed=9861 --take=1
          --max-level=2 --max-attempts=6 --max-total-attempts=16
          --out=reports/v013-stage632-cohort-stage633-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage633-native-calibration-smoke
          path: |
            reports/v013-stage633-stat-only-smoke.json
            reports/v013-stage632-cohort-stage633-smoke.json
          retention-days: 35
          if-no-files-found: warn

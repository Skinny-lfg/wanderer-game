name: E.2.2 Merchant purchase validation
on:
  push:
    branches: [development]
    paths: [.github/workflows/e22-merchant-validation.yml]
  workflow_dispatch:
jobs:
  merchant-purchase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/v012-phase-e22-merchant-validation.cjs
      - name: Real purchases and offer power comparison
        run: node scripts/v012-phase-e22-merchant-validation.cjs | tee /tmp/e22-output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e22-merchant-audit-log
          path: /tmp/e22-output.log
          if-no-files-found: ignore

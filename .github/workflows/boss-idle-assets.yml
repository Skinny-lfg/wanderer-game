name: Prepare boss idle frames
on:
  push:
    branches: [development]
    paths:
      - 'scripts/prepare-boss-idle-frames.py'
      - '.github/workflows/boss-idle-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  derive-boss-idle:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow==11.3.0
      - name: Generate matching transparent idle PNGs
        run: python scripts/prepare-boss-idle-frames.py
      - name: Verify byte-for-byte reproducibility
        run: python scripts/prepare-boss-idle-frames.py --check
      - name: Commit new boss idle images to development only
        shell: bash
        run: |
          git add assets/bosses/animated/*_idle.png
          if git diff --cached --quiet; then
            echo 'All boss idles already match.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'assets(boss): generate idle first-frame portraits'
          git push origin HEAD:development

name: Wanderer C.2 two-Legendary balance audit
on:
  push:
    branches: [development]
    paths:
      - '.github/workflows/c2-legendary-audit.yml'
      - 'scripts/v012-phase-c2-two-legendary-sim.cjs'
  workflow_dispatch:

jobs:
  paired-two-legendary-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate audit source
        run: node --check scripts/v012-phase-c2-two-legendary-sim.cjs
      - name: Simulate zero, one and two Legendaries on the production runtime
        run: node scripts/v012-phase-c2-two-legendary-sim.cjs /tmp/wanderer-phase-c2-results.json
      - name: Archive complete C.2 result matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wanderer-c2-two-legendary-results-${{ github.sha }}
          path: /tmp/wanderer-phase-c2-results.json
          if-no-files-found: ignore

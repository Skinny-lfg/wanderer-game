name: Stage 7.4 isolated Pages build (temporary)
on:
  push:
    branches:
      - integration/v013-stage74-preview-20261118
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild isolated preview
        run: npm run build:pages
      - name: Verify preview is v9 and account-free
        run: |
          test -f docs/index.html
          grep -q "PREFIX='wanderer_automatic_rpg_preview_v9_'" docs/online/v012-save.js
          grep -q 'Fate Distillate' docs/index.html
          grep -q 'Veilsight Elixir' docs/index.html
          ! grep -q 'src="online/v012-account.mjs"' docs/index.html
          ! grep -q 'src="online/v012-auth-bootstrap.js"' docs/index.html
          ! grep -q 'src="online/firebase-client.mjs"' docs/index.html
      - name: Commit Pages build onto integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs
          if ! git diff --cached --quiet; then
            git commit -m "Build Stage 7.4 isolated v0.13 Pages preview [skip ci]"
            git push origin HEAD:refs/heads/integration/v013-stage74-preview-20261118
          fi

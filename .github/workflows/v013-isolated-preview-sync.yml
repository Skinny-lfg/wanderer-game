name: Wanderer v0.13 isolated preview source sync (NO DEPLOY)
on:
  push:
    branches: [audit/v013-consolidation-code-review-20261122]
    paths:
      - '.github/workflows/v013-isolated-preview-sync.yml'
      - 'index.html'
      - 'online/v012-save.js'
      - 'scripts/prepare-automatic-preview.mjs'
      - 'scripts/update-pages-preview.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: isolated-preview-sync-v013-audit
  cancel-in-progress: false
jobs:
  update-generated-docs:
    if: github.ref == 'refs/heads/audit/v013-consolidation-code-review-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/v013-consolidation-code-review-20261122
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Regenerate only isolated docs files
        run: npm run build:pages
      - name: Commit only derived docs to this audit branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs
          if git diff --cached --quiet; then
            echo 'ISOLATED_PREVIEW_ALREADY_SYNCED=true'
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(v013): synchronize isolated docs preview with source [skip ci]'
            git push origin HEAD:refs/heads/audit/v013-consolidation-code-review-20261122
            echo 'ISOLATED_PREVIEW_SYNCED=true'
          fi
          git status --porcelain -- docs

name: v0.13 B1.2C.1 - advanced earned agent behaviour audit
on:
  push:
    branches: [balance/b1.2c1-advanced-agent-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Attunement audit regression
        run: node --test tests/v013-b12c1-attunement.test.cjs
      - name: Replay selected earned accounts
        run: node scripts/v013-b12c1-advanced-agent-audit.cjs ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b12c1-shard-${{ matrix.shard }}
          path: reports/b12c1/shard-${{ matrix.shard }}.json
          if-no-files-found: error
  aggregate:
    needs: audit
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: b12c1-shard-*
          merge-multiple: true
          path: reports/b12c1
      - run: node scripts/v013-b12c1-advanced-agent-audit.cjs aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b12c1-summary
          path: reports/b12c1/summary.json
          if-no-files-found: warn

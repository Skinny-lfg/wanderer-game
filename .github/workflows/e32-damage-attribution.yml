name: E.3.2 Damage attribution
on:
  push:
    branches: [development]
    paths: [.github/workflows/e32-damage-attribution.yml]
  workflow_dispatch:
jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run instrumented damage attribution (180 combats)
        run: node scripts/v012-phase-e32-damage-attribution.cjs /tmp/e32.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e32-damage-attribution
          path: /tmp/e32.json
          if-no-files-found: ignore

name: Wanderer Stage 6.14 follow-up — Retest 3 skills on 32 paired seeds × 3 enemies (NO DEPLOY)
on:
  push:
    branches:
      - audit/v013-stage614-rerun-three-20261121
    paths:
      - '.github/workflows/v013-stage614-rerun-three.yml'
      - 'scripts/v013-stage614-rerun-three.cjs'
      - 'tests/v013-stage614-rerun-three.test.cjs'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validated-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Validate all original node snapshots, independent paired seeds, no build drift, and prior stage regressions
        run: |
          node --check scripts/v013-stage614-rerun-three.cjs
          node --check tests/v013-stage614-rerun-three.test.cjs
          npm run test:v013:stage614:retest
          npm run test:v013:stage614
          npm run test:v013:stage613
          npm run test:v013:stage612
          npm run test:v013:stage611
          npm run test:v013:stage610
          git diff --check
      - name: Pilot — nine enemy cohorts × four native matched seeds = 72 genuine fights
        run: npm run audit:v013:stage614:retest:pilot
      - name: Preserve exact pilot native matchups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage614-retest-three-pilot-36-pairs
          path: |
            reports/v013-stage614-retest-pilot.json
            reports/v013-stage614-retest-pilot.md
          retention-days: 30
          if-no-files-found: warn
  full-cohort:
    needs: validated-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Native retest — 3 exact nodes × 3 opponent strata × 32 independent seeds × 2 real fights = 576
        run: npm run audit:v013:stage614:retest:matrix
      - name: Preserve full raw native snapshots and separate per-opponent results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage614-retest-three-full-288-pairs-576-fights
          path: |
            reports/v013-stage614-retest-matrix.json
            reports/v013-stage614-retest-matrix.md
          retention-days: 30
          if-no-files-found: warn

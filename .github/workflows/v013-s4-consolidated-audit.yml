name: v0.13 S4 - consolidated integration and parity audit
on:
  push:
    branches: [release/v013-consolidated]
    paths: ['.github/workflows/v013-s4-consolidated-audit.yml','scripts/v013-*','scripts/simulate-progression.cjs','tests/v013-s4-*','tests/v013-strategic-build-agents.test.cjs','package.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --prefer-offline --fetch-retries=1 --fetch-timeout=30000
      - name: Current native gate
        run: npm test
      - name: Current strategic agents and R7 regressions
        if: always()
        run: node --test tests/v013-s4-agent-consistency.test.cjs tests/v013-strategic-build-agents.test.cjs tests/v013-s3-agent-sync.test.cjs tests/v013-natural-progression.test.cjs tests/v013-stage6-agent-strategy.test.cjs tests/v013-decay-natural-agent.test.cjs tests/v013-r7c-integration.test.cjs tests/v013-r7b-potion-economy.test.cjs tests/v013-r6-potion-crafting.test.cjs
      - name: Static reference audit
        if: always()
        run: node scripts/v013-c6-final-audit.cjs
  browser-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/v013-runtime-parity.test.cjs tests/v013-s1-parity.test.cjs

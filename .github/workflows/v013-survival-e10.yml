name: Survival hypothesis E10 — offensive plus defensive affinity (NO DEPLOY)
on:
  push:
    branches: [balance/stage-6.40-e1-calibration]
    paths: ['scripts/v013-survival-e10.cjs','tests/v013-survival-e10.test.cjs','.github/workflows/v013-survival-e10.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node --test tests/v013-survival-e10.test.cjs
      - run: node scripts/v013-survival-e10.cjs smoke
  cohort:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        id: ["blood-daggers", "blood-sword", "blood-twohand", "fury-daggers", "fury-bow", "fury-twohand", "decay-cycle-daggers", "decay-cycle-sword", "decay-cycle-twohand", "decay-cycle-bow", "decay-cycle-wand", "decay-cycle-staff"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node scripts/v013-survival-e10.cjs run "${{ matrix.id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: survival-e10-${{ matrix.id }}
          path: reports/survival-e10/*.json
  aggregate:
    needs: cohort
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: survival-e10-*
          path: reports/survival-e10
          merge-multiple: true
      - run: node scripts/v013-survival-e10.cjs aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: survival-e10-report
          path: reports/v013-survival-e10.json

name: Wanderer v0.13 browser QA (isolated, no deploy)

on:
  pull_request:
    paths:
      - 'tests/v013-stage45-4-browser.cjs'
      - 'online/**'
      - 'combat/**'
      - 'economy/**'
      - 'preview/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v013-stage45-4-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Use preinstalled Chrome or install Playwright Chromium
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$CHROME_BIN" ]; then
            echo "CHROMIUM_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
            "$CHROME_BIN" --version
          else
            npx playwright install chromium
          fi
      - name: Stage 4.5.4 — actual desktop and mobile browser QA
        run: npm run test:v013:stage45-browser
      - name: Upload UI screenshots and QA result (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v013-stage45-4-browser-${{ github.run_id }}
          path: reports/stage45-4-browser/
          if-no-files-found: warn

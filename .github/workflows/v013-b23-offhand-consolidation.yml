name: v0.13 B2.3 - Offhand consolidation and held-out confirmation
on:
  push:
    branches: [balance/b2.3-offhand-consolidation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[b23a-recovery]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Current deterministic foundation
        run: node --test tests/v013-b23-offhand-consolidation.test.cjs tests/v013-b2-core-combat-mechanics.test.cjs tests/v013-stage64-mana-fallback.test.cjs tests/v013-gear-loot-daggers.test.cjs tests/v013-offhand-stage2-gear.test.cjs tests/v013-stat-consistency.test.cjs tests/v013-strategic-build-agents.test.cjs tests/v013-natural-progression.test.cjs tests/v013-b12c5-decision-isolation.test.cjs tests/v013-b12c-surrender.test.cjs
      - name: Current full regression gate
        if: always()
        run: npm test
  browser-parity:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[b23a-recovery]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/v013-runtime-parity.test.cjs tests/v013-s1-parity.test.cjs
  controlled:
    needs: deterministic
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        profile: [0,1,2,3,4,5,6,7,8]
        scenario: [0,1,2]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v013-b23-offhand-confirmation.cjs controlled ${{ matrix.profile }} ${{ matrix.scenario }}
      - uses: actions/upload-artifact@v4
        with:
          name: b23-controlled-${{ matrix.profile }}-${{ matrix.scenario }}
          path: reports/b23/controlled-${{ matrix.profile }}-${{ matrix.scenario }}.json
  agents:
    needs: deterministic
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        profile: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v013-b23-offhand-confirmation.cjs agent ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: b23-agent-${{ matrix.profile }}
          path: reports/b23/agent-${{ matrix.profile }}.json
  aggregate:
    needs: [controlled, agents]
    if: always() && (needs.controlled.result == 'success' || needs.agents.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: b23-*
          merge-multiple: true
          path: reports/b23
      - run: node scripts/v013-b23-offhand-confirmation.cjs aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b23-summary
          path: reports/b23/summary.json

  recovery:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[b23a-recovery]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Targeted mechanical and probe regressions
        run: node --test tests/v013-b23-offhand-consolidation.test.cjs tests/v013-natural-progression.test.cjs
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45983097723
          pattern: b23-*
          merge-multiple: true
          path: reports/b23
      - name: Recover original evidence and replay only affected seeds
        run: node scripts/v013-b23-offhand-confirmation.cjs recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b23a-recovery
          path: reports/b23a

name: v0.13 B2.3 - Offhand consolidation and held-out confirmation
on:
  push:
    branches: [balance/b2.3-offhand-consolidation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic:
    if: github.event_name != 'push' || (!contains(github.event.head_commit.message, '[b23a-recovery]') && !contains(github.event.head_commit.message, '[b23b-stalemate]') && !contains(github.event.head_commit.message, '[b23c-final]') && !contains(github.event.head_commit.message, '[b31-audit]') && !contains(github.event.head_commit.message, '[b31a-budget]') && !contains(github.event.head_commit.message, '[b31b-compensation]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Current deterministic foundation
        run: node --test tests/v013-b23-offhand-consolidation.test.cjs tests/v013-b2-core-combat-mechanics.test.cjs tests/v013-stage64-mana-fallback.test.cjs tests/v013-gear-loot-daggers.test.cjs tests/v013-offhand-stage2-gear.test.cjs tests/v013-stat-consistency.test.cjs tests/v013-strategic-build-agents.test.cjs tests/v013-natural-progression.test.cjs tests/v013-b12c5-decision-isolation.test.cjs tests/v013-b12c-surrender.test.cjs
      - name: Current full regression gate
        if: always()
        run: npm test
  browser-parity:
    if: github.event_name != 'push' || (!contains(github.event.head_commit.message, '[b23a-recovery]') && !contains(github.event.head_commit.message, '[b23b-stalemate]') && !contains(github.event.head_commit.message, '[b23c-final]') && !contains(github.event.head_commit.message, '[b31-audit]') && !contains(github.event.head_commit.message, '[b31a-budget]') && !contains(github.event.head_commit.message, '[b31b-compensation]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/v013-runtime-parity.test.cjs tests/v013-s1-parity.test.cjs
  controlled:
    needs: deterministic
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        profile: [0,1,2,3,4,5,6,7,8]
        scenario: [0,1,2]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v013-b23-offhand-confirmation.cjs controlled ${{ matrix.profile }} ${{ matrix.scenario }}
      - uses: actions/upload-artifact@v4
        with:
          name: b23-controlled-${{ matrix.profile }}-${{ matrix.scenario }}
          path: reports/b23/controlled-${{ matrix.profile }}-${{ matrix.scenario }}.json
  agents:
    needs: deterministic
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        profile: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v013-b23-offhand-confirmation.cjs agent ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: b23-agent-${{ matrix.profile }}
          path: reports/b23/agent-${{ matrix.profile }}.json
  aggregate:
    needs: [controlled, agents]
    if: always() && (needs.controlled.result == 'success' || needs.agents.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: b23-*
          merge-multiple: true
          path: reports/b23
      - run: node scripts/v013-b23-offhand-confirmation.cjs aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b23-summary
          path: reports/b23/summary.json

  recovery:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[b23a-recovery]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Targeted mechanical and probe regressions
        run: node --test tests/v013-b23-offhand-consolidation.test.cjs tests/v013-natural-progression.test.cjs
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45983097723
          pattern: b23-*
          merge-multiple: true
          path: reports/b23
      - name: Recover original evidence and replay only affected seeds
        run: node scripts/v013-b23-offhand-confirmation.cjs recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b23a-recovery
          path: reports/b23a

  stalemate:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[b23b-stalemate]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Native enemy abilities, surrender settlement and offhand regressions
        run: node --test tests/v013-stage81-enemy-abilities.test.cjs tests/v013-b12c-surrender.test.cjs tests/v013-b23-offhand-consolidation.test.cjs tests/v013-natural-progression.test.cjs
      - name: Selective stalemate diagnosis
        run: node scripts/v013-b23b-stalemate.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b23b-stalemate
          path: reports/b23b

  final-gate:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[b23c-final]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/v013-b23-offhand-consolidation.test.cjs tests/v013-stage81-enemy-abilities.test.cjs tests/v013-b12c-surrender.test.cjs
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/v013-runtime-parity.test.cjs tests/v013-s1-parity.test.cjs

  final-control:
    needs: final-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45983097723
          pattern: b23-*
          merge-multiple: true
          path: reports/b23
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45985885699
          name: b23a-recovery
          path: reports/b23a
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45986706270
          name: b23b-stalemate
          path: reports/b23b
      - run: node scripts/v013-b23c-final.cjs control
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b23c-control
          path: reports/b23c

  final-agents:
    needs: final-gate
    strategy:
      fail-fast: false
      matrix:
        profile: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45983097723
          name: b23-agent-${{ matrix.profile }}
          path: reports/b23
      - run: node scripts/v013-b23c-final.cjs agent ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b23c-agent-${{ matrix.profile }}
          path: reports/b23c

  final-summary:
    needs: [final-control, final-agents]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: b23c-*
          merge-multiple: true
          path: reports/b23c
      - run: node scripts/v013-b23c-final.cjs aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b23c-final-summary
          path: reports/b23c/final-summary.json

  b31-gate:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[b31-audit]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/v013-b23-offhand-consolidation.test.cjs tests/v013-stat-consistency.test.cjs tests/v013-b12c-surrender.test.cjs
      - run: node scripts/v013-b31-equipment-audit.cjs smoke

  b31-equipment:
    needs: b31-gate
    strategy:
      fail-fast: false
      matrix:
        study: [0,1,2,3,4,5,6,7,8]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v013-b31-equipment-audit.cjs study ${{ matrix.study }}
      - uses: actions/upload-artifact@v4
        with:
          name: b31-study-${{ matrix.study }}
          path: reports/b31/study-${{ matrix.study }}.json

  b31-agents:
    needs: b31-gate
    strategy:
      fail-fast: false
      matrix:
        profile: [0,1,2,3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v013-b31-equipment-audit.cjs agent ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: b31-agent-${{ matrix.profile }}
          path: reports/b31/agent-${{ matrix.profile }}.json

  b31-summary:
    needs: [b31-equipment, b31-agents]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: b31-*
          merge-multiple: true
          path: reports/b31
      - run: node scripts/v013-b31-equipment-audit.cjs aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b31-summary
          path: reports/b31/summary.json

  b31a-gate:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[b31a-budget]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/v013-b23-offhand-consolidation.test.cjs tests/v013-stat-consistency.test.cjs tests/v013-b12c-surrender.test.cjs
      - run: node scripts/v013-b31a-twohand-budget.cjs smoke

  b31a-loadout:
    needs: b31a-gate
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        study: [0,1,2,3,4]
        scenario: [0,1,2,3,4]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v013-b31a-twohand-budget.cjs loadout ${{ matrix.study }} ${{ matrix.scenario }}
      - uses: actions/upload-artifact@v4
        with:
          name: b31a-loadout-${{ matrix.study }}-${{ matrix.scenario }}
          path: reports/b31a/loadout-${{ matrix.study }}-${{ matrix.scenario }}.json

  b31a-status:
    needs: b31a-gate
    strategy:
      fail-fast: false
      matrix:
        study: [0,1]
        scenario: [1,3]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v013-b31a-twohand-budget.cjs status ${{ matrix.study }} ${{ matrix.scenario }}
      - uses: actions/upload-artifact@v4
        with:
          name: b31a-status-${{ matrix.study }}-${{ matrix.scenario }}
          path: reports/b31a/status-${{ matrix.study }}-${{ matrix.scenario }}.json

  b31a-summary:
    needs: [b31a-loadout, b31a-status]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: b31a-*
          merge-multiple: true
          path: reports/b31a
      - run: node scripts/v013-b31a-twohand-budget.cjs aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b31a-summary
          path: reports/b31a/summary.json

  b31b-gate:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[b31b-compensation]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/v013-b23-offhand-consolidation.test.cjs tests/v013-stat-consistency.test.cjs tests/v013-b12c-surrender.test.cjs
      - run: node scripts/v013-b31b-twohand-compensation.cjs smoke

  b31b-study:
    needs: b31b-gate
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        study: [0,1,2,3,4,5,6,7]
        scenario: [0,1,2,3,4]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/v013-b31b-twohand-compensation.cjs study ${{ matrix.study }} ${{ matrix.scenario }}
      - uses: actions/upload-artifact@v4
        with:
          name: b31b-study-${{ matrix.study }}-${{ matrix.scenario }}
          path: reports/b31b/study-${{ matrix.study }}-${{ matrix.scenario }}.json

  b31b-summary:
    needs: b31b-study
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: b31b-study-*
          merge-multiple: true
          path: reports/b31b
      - run: node scripts/v013-b31b-twohand-compensation.cjs aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b31b-summary
          path: reports/b31b/summary.json

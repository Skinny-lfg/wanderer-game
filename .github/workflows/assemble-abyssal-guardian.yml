name: Import verified Abyssal Guardian art
on:
  push:
    branches: [development]
    paths:
      - 'assets/bosses/_abyssal_chunks/**'
      - '.github/workflows/assemble-abyssal-guardian.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble PNG without quality loss and verify its SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test -d assets/bosses/_abyssal_chunks
          for i in $(seq -w 0 8); do
            cat "assets/bosses/_abyssal_chunks/part_${i}.b64"
          done | base64 --decode > assets/bosses/abyssal-guardian.png
          printf '%s  %s\n' '692a9fa950a8880e3596941306d81b5acbac7dfaa2c68ec9c1bb4e2033b96a86' 'assets/bosses/abyssal-guardian.png' | sha256sum --check
          file assets/bosses/abyssal-guardian.png
      - name: Commit image to development only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r assets/bosses/_abyssal_chunks
          git add assets/bosses/abyssal-guardian.png
          git commit -m "assets(v0.10.0): add verified Abyssal Guardian fade PNG"
          git push origin HEAD:development

name: Stage 6.48B.1 — Random principal reinforcements and active cap diagnostic (NO DEPLOY)
on:
  push:
    branches: [balance/stage-6.40-e1-calibration]
    paths: ['.github/workflows/v013-stage648b1-distribution.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: synergy-balanced
          path: input/earned
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45430920656
      - uses: actions/download-artifact@v4
        with:
          name: stage648b-balanced
          path: input/baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45440574236
      - run: node scripts/v013-stage648b1-distribution.cjs smoke
  cohort:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        profile: [cautious, balanced, plate-warden, cloth-battlemage, leather-duelist, hexblade-hybrid, smart-blood-pure, smart-fury-daggers, smart-radiance-pure, smart-aegis-radiance, smart-arcane-arcane-pure, smart-arcane-fire-pure, arcane-frost, smart-arcane-lightning-pure, smart-decay-arcane-aegis, smart-blood-sword, smart-blood-fury, smart-blood-fury-radiance, smart-blood-fury-radiance-no-mixed, smart-fury-blood-aegis, smart-fury-pure, smart-arcane-fire-aegis, smart-arcane-frost-radiance, smart-arcane-wand, smart-arcane-staff, smart-arcane-wand-offense, smart-arcane-wand-defense, decay-wand, decay-two-handed, aegis-sword-shield, aegis-mace-shield, aegis-wand-orb, radiance-sword-charm, radiance-staff, arcane-sword-infusion]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: synergy-${{ matrix.profile }}
          path: input/earned
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45430920656
      - uses: actions/download-artifact@v4
        with:
          name: stage648b-${{ matrix.profile }}
          path: input/baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45440574236
      - run: node scripts/v013-stage648b1-distribution.cjs run ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage648b1-${{ matrix.profile }}
          path: reports/stage648b1/*.json
  aggregate:
    needs: [smoke, cohort]
    if: ${{ always() && needs.smoke.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: stage648b1-*
          path: reports/stage648b1
          merge-multiple: true
      - run: node scripts/v013-stage648b1-distribution.cjs aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage648b1-report
          path: reports/v013-stage648b1-distribution.json

name: Wanderer v0.13 simulator mechanics parity probe (audit only)
on:
  push:
    branches: [audit/v013]
    paths: ['.github/workflows/v013-simulator-parity-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-parity:
    if: github.ref == 'refs/heads/audit/v013'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Identify game scripts not evaluated by VM simulator harness
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const harness=fs.readFileSync('tests/v012-economy-harness.cjs','utf8');
          const live=[...html.matchAll(/<script\b[^>]*src="([^"]+)"[^>]*>/g)].map(x=>x[1].replace(/\?.*$/,''));
          const fixed=[...harness.match(/const files=\[([^\]]+)\]/)[1].matchAll(/'([^']+)'/g)].map(x=>x[1]);
          const runtime=live.filter(x=>/-runtime\.js$/.test(x));
          const vm=new Set([...fixed,...runtime,'combat/talent-graph-next.js','combat/talent-graph-bridge.js']);
          const omitted=live.filter(x=>!vm.has(x));
          console.log('LIVE_SCRIPTS',live.length);
          console.log('SIM_VM_SCRIPTS',vm.size);
          console.log('OMITTED_LIVE_SCRIPTS',JSON.stringify(omitted));
          for(const file of ['economy/v013-crafting.js','economy/v013-gear-rolls.js'])
            if(!live.includes(file)||!vm.has(file))throw Error('Missing shared Forge module: '+file);
          NODE
      - name: Verify isolated engine tests and the browser vs VM trace
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$CHROME_BIN" ]; then
            echo "WANDERER_BROWSER=$CHROME_BIN" >> "$GITHUB_ENV"
            export WANDERER_BROWSER="$CHROME_BIN"
            "$CHROME_BIN" --version
          else
            npx playwright install chromium
          fi
          npm run test:v013:sim
          node --test tests/v013-runtime-parity.test.cjs tests/v013-gear-roll-diversity.test.cjs
          node --test tests/v013-natural-progression.test.cjs tests/v013-stage94-human-decisions.test.cjs

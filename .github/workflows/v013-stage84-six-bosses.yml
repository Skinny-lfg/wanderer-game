name: Stage 8.4 Six affinity Bosses
on:
  pull_request:
    branches: [publish/automatic-rpg-preview]
  push:
    branches: [feature/v013-stage84-boss-abilities-20261118]
jobs:
  stage84:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Boss roster, mechanics, combat and native Dungeon
        run: node --test tests/v013-stage80-enemy-roster.test.cjs tests/v013-stage81-enemy-abilities.test.cjs tests/v013-stage82-elite-abilities.test.cjs tests/v013-stage83-boss-infrastructure.test.cjs tests/v013-stage84-six-bosses.test.cjs

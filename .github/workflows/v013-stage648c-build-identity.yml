name: Stage 6.48C — Build identity and talent activation audit (NO SIMULATION, NO DEPLOY)
on:
  push:
    branches: [balance/stage-6.40-e1-calibration]
    paths: ['.github/workflows/v013-stage648c-build-identity.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: synergy-*
          path: input/earned
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45430920656
      - uses: actions/download-artifact@v4
        with:
          pattern: stage648b2-*
          path: input/calibrated
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 45446227838
      - run: node scripts/v013-stage648c-build-identity.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage648c-build-identity
          path: reports/v013-stage648c-build-identity.json

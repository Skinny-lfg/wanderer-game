name: Capture current Talent Tree (NO DEPLOY)
on:
  push:
    branches: [balance/stage-6.40-e1-calibration]
    paths: ['.github/workflows/capture-current-talent-tree.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture real game tab, default and full tree
        run: |
          node <<'JS'
          const fs=require('node:fs'),path=require('node:path'),http=require('node:http'),assert=require('node:assert/strict');
          const {execFileSync}=require('node:child_process'),{chromium}=require('playwright');
          (async()=>{
            const prefix='Isolated automatic RPG preview: ',output=execFileSync(process.execPath,['scripts/prepare-automatic-preview.mjs'],{encoding:'utf8'}).trim();
            assert(output.startsWith(prefix));const root=path.resolve(output.slice(prefix.length));
            const mime={'.html':'text/html; charset=utf-8','.js':'text/javascript','.mjs':'text/javascript','.css':'text/css','.json':'application/json','.png':'image/png','.jpg':'image/jpeg','.jpeg':'image/jpeg','.webp':'image/webp','.svg':'image/svg+xml','.woff2':'font/woff2','.woff':'font/woff','.ttf':'font/ttf','.gif':'image/gif'};
            const server=http.createServer((req,res)=>{
              const u=new URL(req.url,'http://127.0.0.1'),f=path.resolve(root,'.'+(u.pathname==='/'?'/index.html':decodeURIComponent(u.pathname)));
              if(!f.startsWith(root+path.sep))return res.writeHead(403).end();
              fs.readFile(f,(err,data)=>{if(err)return res.writeHead(404).end();res.writeHead(200,{'Content-Type':mime[path.extname(f)]||'application/octet-stream'}).end(data);});
            });
            await new Promise(r=>server.listen(0,'127.0.0.1',r));
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:1920,height:1080},deviceScaleFactor:1});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:'+server.address().port,{waitUntil:'load'});
              await page.getByRole('button',{name:'Talents',exact:true}).click();
              const frame=page.frameLocator('iframe[title="Talent tree"]');
              await frame.locator('#nodes .node').first().waitFor({timeout:30000});
              const count=await frame.locator('#nodes .node').count();
              assert.equal(await page.evaluate(()=>WandererAutomaticTalents.NODES.length),367);
              assert(count>=300);
              await page.evaluate(()=>document.fonts.ready);
              await frame.locator('body').evaluate(async()=>{await document.fonts.ready;await Promise.all(Array.from(document.images,i=>i.decode().catch(()=>{})));});
              fs.mkdirSync('reports/current-talent-tree',{recursive:true});
              await page.screenshot({path:'reports/current-talent-tree/talent-tree-current.png',animations:'disabled',fullPage:true});
              await frame.getByRole('button',{name:'Full tree',exact:true}).click();
              await page.screenshot({path:'reports/current-talent-tree/talent-tree-full.png',animations:'disabled',fullPage:true});
              assert.deepEqual(errors,[]);
              const meta={commit:process.env.GITHUB_SHA,viewport:'1920x1080',graphNodes:count,errors};
              fs.writeFileSync('reports/current-talent-tree/capture.json',JSON.stringify(meta,null,2));
              console.log('TALENT_TREE_CAPTURE='+JSON.stringify(meta));
            }finally{await browser.close();await new Promise(r=>server.close(r));}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: talent-tree-current-1920x1080
          path: reports/current-talent-tree/
          if-no-files-found: error

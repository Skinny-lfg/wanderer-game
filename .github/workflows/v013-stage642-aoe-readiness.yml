name: Wanderer Stage 6.42 — AoE talent access and mechanic safeguards (NO DEPLOY)
on:
  push:
    branches: [balance/stage-6.40-e1-calibration]
    paths:
      - '.github/workflows/v013-stage642-aoe-readiness.yml'
      - 'tests/v013-stage642-aoe-readiness.test.cjs'
      - 'scripts/v013-build-planner.cjs'
      - 'scripts/v013-stage639-earned-aoe-comparison.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - name: Verify legal Bow acquisition, prepared Grave Bloom and exact docs mirrors
        run: |
          node --check scripts/v013-build-planner.cjs
          node --check scripts/v013-stage639-earned-aoe-comparison.cjs
          node --test tests/v013-stage642-aoe-readiness.test.cjs tests/v013-stage641-build-readiness.test.cjs tests/v013-stage642-single-budget.test.cjs
          git diff --check

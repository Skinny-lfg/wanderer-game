name: Armor and Rotguard native validation E10 (NO DEPLOY)
on:
  push:
    branches: [balance/stage-6.40-e1-calibration]
    paths: ['scripts/v013-armor-rotguard.cjs','tests/v013-armor-rotguard.test.cjs','.github/workflows/v013-armor-rotguard.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node --test tests/v013-armor-rotguard.test.cjs tests/v0120-evasion.test.cjs
      - run: node scripts/v013-armor-rotguard.cjs smoke
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm test
  cohort:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        id: ["blood-daggers", "blood-sword", "blood-twohand", "fury-daggers", "fury-bow", "fury-twohand", "radiance-sword", "radiance-mace", "radiance-wand", "aegis-sword", "aegis-mace", "aegis-orb", "decay-cycle-daggers", "decay-focus-daggers", "decay-cycle-sword", "decay-focus-sword", "decay-cycle-twohand", "decay-focus-twohand", "decay-cycle-bow", "decay-focus-bow", "decay-cycle-wand", "decay-focus-wand", "decay-cycle-staff", "decay-focus-staff", "arcane-arcane-sword", "arcane-arcane-wand", "arcane-arcane-staff", "arcane-fire-sword", "arcane-fire-wand", "arcane-fire-staff", "arcane-frost-sword", "arcane-frost-wand", "arcane-frost-staff", "arcane-lightning-sword", "arcane-lightning-wand", "arcane-lightning-staff"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node scripts/v013-armor-rotguard.cjs run "${{ matrix.id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: armor-rotguard-${{ matrix.id }}
          path: reports/armor-rotguard/*.json
  aggregate:
    needs: cohort
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: armor-rotguard-*
          path: reports/armor-rotguard
          merge-multiple: true
      - run: node scripts/v013-armor-rotguard.cjs aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: armor-rotguard-report
          path: reports/v013-armor-rotguard.json

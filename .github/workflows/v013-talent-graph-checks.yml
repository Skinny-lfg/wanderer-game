name: v0.13 talent-graph regression
on:
  pull_request:
    branches:
      - publish/automatic-rpg-preview
    paths:
      - 'combat/talent-graph-*.js'
      - 'preview/talent-rebuild/**'
      - 'docs/preview/talent-rebuild/**'
      - 'tests/talent-graph-*.cjs'
      - 'package.json'
      - '.github/workflows/v013-talent-graph-checks.yml'
permissions:
  contents: read
jobs:
  talent-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:v013:talent-graph

  red-diagonal-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/talent-graph-screenshot.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wanderer-red-diagonal-screenshots
          path: reports/v013-red-diagonal-preview/*.png
          if-no-files-found: warn

name: E.3 Combat diagnostics
on:
  push:
    branches: [development]
    paths: [.github/workflows/e3-combat-diagnostic.yml]
  workflow_dispatch:
jobs:
  combat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Matched seed combat variants
        run: node scripts/v012-phase-e3-combat-diagnostic.cjs /tmp/e3.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e3-combat-diagnostic-results
          path: /tmp/e3.json
          if-no-files-found: ignore

name: E.2.7 Persistent Apothecary audit
on:
  push:
    branches: [development]
    paths: [.github/workflows/e27-persistent-apothecary.yml]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run 1080 persistent simulations
        env:
          WANDERER_E11_RUNS: '1080'
        run: node scripts/v012-phase-e27-persistent-apothecary.cjs /tmp/wanderer-e27.json
      - name: Summarize economic outcomes
        run: |
          node - <<'NODE'
          const d=require('/tmp/wanderer-e27.json');
          for(const p of ['base','survival','fortune','adaptive']){
            const a=d.agents.filter(x=>x.profile===p),r=d.rows.filter(x=>x.profile===p);
            const sum=k=>r.reduce((n,x)=>n+(x[k]||0),0);
            console.log('E27_SUMMARY '+JSON.stringify({profile:p,runs:r.length,wins:r.filter(x=>x.win).length,errors:r.filter(x=>x.error).length,maxUnlocked:Math.max(...a.map(x=>x.unlocked)),goldEarned:a.reduce((n,x)=>n+x.goldEarned,0),goldSpent:a.reduce((n,x)=>n+x.goldSpent,0),goldFinal:a.reduce((n,x)=>n+x.final.gold,0),buyGold:sum('potionGold'),rerollGold:sum('potionRefreshGold'),purchases:sum('potionPurchases'),refreshes:sum('potionRefreshes'),used:r.reduce((n,x)=>n+x.potionsUsed.length,0),lootKept:sum('lootKept'),lootLost:sum('lootLost'),treasuresKept:sum('treasuresKept'),unlocked:a.map(x=>x.unlocked)}));
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wanderer-e27-results
          path: /tmp/wanderer-e27.json
          if-no-files-found: ignore

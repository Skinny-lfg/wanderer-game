name: Wanderer v0.13 — Stage 6.1 Arcane experiment and Gravecaller souls
on:
  push:
    branches: [audit/v013-stage6]
    paths:
      - '.github/workflows/v013-stage61-magic-gravecaller.yml'
      - 'tests/v013-gravecaller-bound-souls.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage61-and-souls:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Focused native mechanics and cosmetic parity tests
        run: |
          node --test \
            tests/v013-stage61-arcane-infusion.test.cjs \
            tests/v013-gravecaller-bound-souls.test.cjs \
            tests/v013-stage82-elite-abilities.test.cjs \
            tests/v013-offhand-dagger-any-main.test.cjs \
            tests/talent-graph-combat.test.cjs \
            tests/v013-offhand-stage2-gear.test.cjs
          git diff --check
      - name: Controlled 60s Arcane Infusion model on native derived player stats
        run: node scripts/v013-stage61-arcane-infusion.cjs
      - name: Verify native Gravecaller outcomes unchanged from pre-cosmetic revision
        run: |
          git worktree add --detach "$RUNNER_TEMP/wanderer-before" 89816c5b479dcab45224b0b2dbc1a336f34b530e
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/wanderer-before/node_modules"
          node scripts/v013-gravecaller-native-parity.cjs --root="$RUNNER_TEMP/wanderer-before" --out=reports/stage61-gravecaller-before.json
          node scripts/v013-gravecaller-native-parity.cjs --root="$GITHUB_WORKSPACE" --out=reports/stage61-gravecaller-after.json
          node -e "const assert=require('node:assert/strict'),fs=require('node:fs');const a=JSON.parse(fs.readFileSync('reports/stage61-gravecaller-before.json')),b=JSON.parse(fs.readFileSync('reports/stage61-gravecaller-after.json'));assert.deepEqual(b,a);console.log('GRAVECALLER_NATIVE_PARITY='+JSON.stringify({matches:a.length,sameMetrics:true,seeds:a.map(x=>x.seed)}))"
      - name: Publish experimental metrics as run artifacts, never deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage61-arcane-and-gravecaller-evidence
          path: |
            reports/stage61-arcane-infusion.json
            reports/stage61-arcane-infusion.md
            reports/stage61-gravecaller-before.json
            reports/stage61-gravecaller-after.json
          retention-days: 30
          if-no-files-found: warn

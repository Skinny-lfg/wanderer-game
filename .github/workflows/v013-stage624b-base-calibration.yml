name: Wanderer Stage 6.24B — E1-E5 paired calibration pilot (NO DEPLOY)
on:
  push:
    branches: [audit/v013-stage624b-e1-e5-calibration-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - name: Validate unchanged gameplay and native candidate VM
        run: |
          node --check scripts/simulate-progression.cjs
          node --check scripts/v013-stage624b-base-audit.cjs
          node --test tests/v013-stage624b-base-audit.test.cjs tests/v013-stage624-e1-e5-baseline.test.cjs tests/v013-stage623-earned-matched-enemies.test.cjs
          npm run test:v013:gate
          node scripts/v013-c6-final-audit.cjs
          npm run build:pages
          git diff --check
  candidate:
    needs: validate
    name: Native earned E1-E5 matched A-B seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [9701,9702,9703,9704]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - name: Native baseline versus isolated candidate, all eight Elites and 3/6/12 normal rooms
        run: >-
          node scripts/v013-stage624b-base-audit.cjs
          --seed=${{ matrix.seed }}
          --out=reports/stage624b-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage624b-candidate-${{ matrix.seed }}
          path: reports/stage624b-${{ matrix.seed }}.json
          if-no-files-found: error
          retention-days: 30
  aggregate:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: stage624b-candidate-*
          path: reports/stage624b-all
          merge-multiple: true
      - name: Validate four seeds and print each individual E1-E5 comparison
        run: |
          node scripts/v013-stage624b-base-audit.cjs --mode=aggregate --inputs=reports/stage624b-all --out=reports/v013-stage624b-candidate-pilot.json
          node - <<'NODE'
          const r=require('./reports/v013-stage624b-candidate-pilot.json');
          if(r.coverage.seeds!==4||r.coverage.earnedSnapshots<45||r.coverage.errors||!r.coverage.allNativeMatched)throw Error('Invalid Stage 6.24B native matched coverage');
          console.log('STAGE624B_ACCEPTED='+JSON.stringify(r.coverage));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: stage624b-aggregate-pilot
          path: reports/v013-stage624b-candidate-pilot.json
          if-no-files-found: error
          retention-days: 30

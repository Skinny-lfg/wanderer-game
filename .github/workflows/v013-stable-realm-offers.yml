name: Wanderer v0.13 — Stable Realm offers regression (no deploy)

on:
  push:
    branches:
      - audit/v013-stage6
    paths:
      - '.github/workflows/v013-stable-realm-offers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/audit/v013-stage6'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Realm offers, map integrity and persistence regressions
        run: |
          node --test \
            tests/v013-stable-realm-offers.test.cjs \
            tests/v013-dungeon-checkpoint-integrity.test.cjs \
            tests/v013-current-dungeon-and-talents.test.cjs \
            tests/v013-natural-progression.test.cjs \
            tests/v012-save.test.mjs
      - name: Validate live-build agent decisions and telemetry
        run: |
          node --check scripts/v013-agent-strategy.cjs
          node --check scripts/v013-natural-progression.cjs
          node --check scripts/v013-stage6-agent-comparison.cjs
          node --check scripts/v013-stage6-controlled-targets.cjs
          node --test tests/v013-stage6-agent-strategy.test.cjs
      - name: Compare E1/E2 agents across repeated paired seeds
        run: |
          node scripts/v013-stage6-agent-comparison.cjs \
            --seeds=9701,9702,9703,9704 \
            --profiles=balanced,plate-warden,leather-duelist,arcane-lightning,hexblade-hybrid \
            --max-level=2 --max-attempts=18 --max-total-attempts=36 \
            --out=reports/stage6-agent-smoke.json
      - name: Controlled guarded Epic Boss/Elite combat with identical native starts
        run: |
          node scripts/v013-stage6-controlled-targets.cjs \
            reports/stage6-target-guarded.json \
            --level=1 --risk=0 --rarity=Epic --points=24
      - name: Archive guarded Boss diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage6-target-guarded
          path: reports/stage6-target-guarded.*
          if-no-files-found: ignore
      - name: Archive diagnostic data even if a later check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage6-agent-smoke
          path: reports/stage6-agent-smoke.*
          if-no-files-found: ignore
      - name: Verify no checkout changes
        run: git diff --exit-code --check

name: Stage 7.5 isolated Pages preparation (temporary)
on:
  pull_request:
    branches:
      - publish/automatic-rpg-preview
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v013-stage75-realm-contract-extraction-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused rewards and preview tests
        run: node --test tests/v013-stage7-contracts.test.cjs tests/automatic-preview.test.cjs
      - name: Regenerate isolated Pages
        run: npm run build:pages
      - name: Verify Stage 7.5 build and Firebase isolation
        run: |
          test -f docs/index.html
          grep -q "PREFIX='wanderer_automatic_rpg_preview_v11_'" docs/online/v012-save.js
          grep -q 'realmChoiceCard' docs/index.html
          grep -q 'stage7BlueprintPreview' docs/index.html
          grep -q 'phase3ContractBlueprintPreview' docs/index.html
          grep -q "c.status==='completed'||c.kind===null" docs/online/v012-save.js
          ! grep -q 'v013ProjectPanel(true)' docs/index.html
          ! grep -q 'src="online/v012-account.mjs"' docs/index.html
          ! grep -q 'src="online/firebase-client.mjs"' docs/index.html
      - name: Commit generated Pages to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs
          if ! git diff --cached --quiet; then
            git commit -m "Build isolated Stage 7.5 v0.13 Pages preview [skip ci]"
            git push origin HEAD:refs/heads/feature/v013-stage75-realm-contract-extraction-20261118
          fi

name: E.2.8 Build and potion matrix
on:
  push:
    branches: [development]
    paths: [.github/workflows/e28-build-comparison.yml]
  workflow_dispatch:
jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute 450 persistent Expeditions
        env:
          WANDERER_E11_RUNS: '450'
        run: node scripts/v012-phase-e28-build-comparison.cjs /tmp/e28.json
      - name: Compare builds and individual Gold
        run: |
          node - <<'NODE'
          const d=require('/tmp/e28.json');
          for (const b of ['Archer','Mage','Battlemage','Tank','Assassin'])for(const p of ['base','adapted','fortune']){
            const a=d.agents.filter(x=>x.buildName===b&&x.profile===p),r=d.rows.filter(x=>x.buildName===b&&x.profile===p);
            console.log('E28 '+JSON.stringify({build:b,plan:p,runs:r.length,wins:r.filter(x=>x.win).length,errors:r.filter(x=>x.error).length,maxUnlock:Math.max(...a.map(x=>x.unlocked)),gold:a.map(x=>x.final.gold),spent:a.reduce((n,x)=>n+x.goldSpent,0),kept:r.reduce((n,x)=>n+x.lootKept,0),lost:r.reduce((n,x)=>n+x.lootLost,0),potionUsed:r.reduce((n,x)=>n+x.potionsUsed.length,0)}));
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wanderer-e28-results
          path: /tmp/e28.json
          if-no-files-found: ignore

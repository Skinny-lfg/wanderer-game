name: E.2.1 Merchant economic audit (isolated)
on:
  push:
    branches: [development]
    paths: [.github/workflows/e21-merchant-audit.yml]
  workflow_dispatch:
jobs:
  merchant:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check scripts/v012-phase-e21-merchant-audit.cjs
      - name: Merchant economics 270 attempts
        env:
          WANDERER_E11_RUNS: '270'
        run: node scripts/v012-phase-e21-merchant-audit.cjs /tmp/wanderer-e21.json
      - name: Summary with spending and acquisition
        run: |
          node - <<'NODE'
          const d=require('/tmp/wanderer-e21.json');
          for(const profile of ['A','B','C']) {
            const a=d.agents.filter(x=>x.profile===profile);
            const sum=k=>a.reduce((n,x)=>n+(x[k]||0),0);
            console.log('E21_METRICS '+JSON.stringify({profile,attempts:sum('attempt'),wins:sum('wins'),defeats:sum('defeats'),unlocked:a.map(x=>x.unlocked),goldEarned:sum('goldEarned'),goldSpent:sum('goldSpent'),goldFinal:a.reduce((n,x)=>n+x.final.gold,0),merchantBuys:sum('merchantBuys'),merchantRefreshes:sum('merchantRefreshes'),merchantEquipped:sum('merchantEquipped'),merchantGoldSpent:sum('merchantGoldSpent'),crafts:sum('crafts'),upgrades:sum('upgrades'),fragmentsSpent:sum('fragmentsSpent'),fragmentsFinal:a.reduce((n,x)=>n+x.final.fragments,0)}));
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wanderer-e21-merchant-trajectories
          path: /tmp/wanderer-e21.json
          if-no-files-found: ignore

name: Wanderer v0.13 Stage S2 native decisions (audit only)
on:
  push:
    branches: [audit/v013]
    paths: ['.github/workflows/v013-s2-parity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  s2-native-decisions:
    if: github.ref == 'refs/heads/audit/v013'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: S2 decisions, S1 transaction parity, eight-elite seed coverage and native Boss behaviors
        run: |
          node --test tests/v013-s2-decisions.test.cjs tests/v013-s1-parity.test.cjs
          node --test tests/v013-stage82-elite-abilities.test.cjs tests/v013-stage95-elite-parity.test.cjs tests/v013-stage84-six-bosses.test.cjs
      - name: Existing natural progression and simulator regression
        run: |
          npm run test:v013:sim
          node --test tests/v013-natural-progression.test.cjs tests/v013-stage94-human-decisions.test.cjs tests/v013-stage5-build-audit.test.cjs tests/v013-tier-upgrade.test.cjs
      - name: Earned-account S2 pilot across all 10 archetypes (E1-E3, no synthetic progression)
        run: |
          node scripts/v013-natural-progression.cjs --seeds=22661 --profiles=cautious,balanced,daring,magic-fire,magic-frost,magic-lightning,plate-warden,leather-duelist,cloth-battlemage,hexblade-hybrid --max-level=3 --max-attempts=3 --max-total-attempts=6 --out=reports/v013-s2-pilot.json
      - name: Preserve independent S2 natural pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v013-s2-native-pilot
          path: |
            reports/v013-s2-pilot.json
            reports/v013-s2-pilot.md
          if-no-files-found: warn
          retention-days: 30
      - name: Real browser versus VM runtime parity
        shell: bash
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$CHROME_BIN" ]; then
            export WANDERER_BROWSER="$CHROME_BIN"
            "$CHROME_BIN" --version
          else
            npx playwright install chromium
          fi
          node --test tests/v013-runtime-parity.test.cjs

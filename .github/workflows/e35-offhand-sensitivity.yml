name: E.3.5 Offhand sensitivity
on:
  push:
    branches: [development]
    paths: [.github/workflows/e35-offhand-sensitivity.yml]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare nerfed offhand and legacy coefficients
        run: node scripts/v012-phase-e35-offhand-sensitivity.cjs /tmp/e35.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e35-results
          path: /tmp/e35.json
          if-no-files-found: ignore

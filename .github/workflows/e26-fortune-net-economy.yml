name: E.2.6 Fortune net economy
on:
  push:
    branches: [development]
    paths: [.github/workflows/e26-fortune-net-economy.yml]
  workflow_dispatch:
jobs:
  e26:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Paired runs with native Apothecary purchases
        run: node scripts/v012-phase-e26-fortune-net-economy.cjs /tmp/wanderer-e26.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wanderer-e26-net-economy
          path: /tmp/wanderer-e26.json
          if-no-files-found: ignore

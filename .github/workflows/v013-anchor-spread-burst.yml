name: Anchor Propagated Rot Burst Eligibility (NO DEPLOY)
on:
  push:
    branches: [balance/stage-6.40-e1-calibration]
    paths: ['scripts/v013-anchor-spread-burst.cjs','.github/workflows/v013-anchor-spread-burst.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node scripts/v013-anchor-spread-burst.cjs smoke
  compare:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [decay-cycle-wand, decay-burst-wand]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node scripts/v013-anchor-spread-burst.cjs ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: anchor-burst-${{ matrix.profile }}
          path: reports/anchor-spread-burst/*.json
  summary:
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: anchor-burst-*
          path: reports/anchor-spread-burst
          merge-multiple: true
      - run: node scripts/v013-anchor-spread-burst.cjs aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: anchor-burst-summary
          path: reports/anchor-spread-burst/summary.json

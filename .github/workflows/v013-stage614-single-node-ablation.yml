name: Wanderer Stage 6.14 — Single-node legal ablation with repeated native seeds (NO DEPLOY)
on:
  push:
    branches:
      - audit/v013-stage614-single-node-ablations-20261121
    paths:
      - '.github/workflows/v013-stage614-single-node-ablation.yml'
      - 'scripts/v013-stage614-single-node-ablation.cjs'
      - 'tests/v013-stage614-single-node-ablation.test.cjs'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Node syntax, exact Talent legality, matching invariants and regressions
        run: |
          node --check scripts/v013-stage614-single-node-ablation.cjs
          node --check tests/v013-stage614-single-node-ablation.test.cjs
          npm run test:v013:stage614
          npm run test:v013:stage613
          npm run test:v013:stage612
          npm run test:v013:stage611
          npm run test:v013:stage610
          git diff --check
      - name: Pilot — six one-node cases on three independently paired seeds each
        run: npm run audit:v013:stage614:pilot
      - name: Save legal first pilot native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage614-6-cases-18-pairs-pilot
          path: |
            reports/v013-stage614-pilot.json
            reports/v013-stage614-pilot.md
          retention-days: 30
          if-no-files-found: warn
  matrix:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Twenty-four one-node cases times six paired independent seeds = 288 real native battles
        run: npm run audit:v013:stage614:matrix
      - name: Persist exact legal node and real native matchup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage614-24-nodes-144-pairs-288-native-fights
          path: |
            reports/v013-stage614-matrix.json
            reports/v013-stage614-matrix.md
          retention-days: 30
          if-no-files-found: warn

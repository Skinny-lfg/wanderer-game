name: Wanderer v0.13 Stage 9.1 - first balance diagnosis (no deploy)
on:
  push:
    branches: [feature/v013-stage91-balance-diagnosis-20261118]
  workflow_dispatch:
jobs:
  first-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Stage 9.1 diagnostics and current native simulator
        run: |
          npm run test:v013:stage91
          npm run test:v013:balance
      - name: Generate 132 native fights (6 Bosses, 3 risks, 3 builds, swarms, Elites)
        run: npm run diagnose:v013:stage91
      - name: Print compact group diagnosis
        if: always()
        run: |
          node -e "const fs=require('fs');const f='reports/v013-stage91-diagnosis.json';if(!fs.existsSync(f))process.exit(0);const x=JSON.parse(fs.readFileSync(f));console.log(JSON.stringify({coverage:x.coverage,flags:x.flags,groups:x.groups.map(g=>({mode:g.mode,boss:g.bossName,affinity:g.affinity,build:g.build,risk:g.risk,n:g.n,win:g.winPctResolved,sec:g.durationP50,hp:g.minHpPctP50,castsPerMin:g.enemyAbilityCastsPerMinute}))},null,2));"
      - name: Preserve JSON and Markdown diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wanderer-v013-stage91-first-diagnosis
          path: |
            reports/v013-stage91-diagnosis.json
            reports/v013-stage91-diagnosis.md
          if-no-files-found: warn
          retention-days: 14

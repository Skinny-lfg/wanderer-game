name: v0.12 endless combat research (no deploy)
on:
  push:
    branches: [development]
    paths:
      - scripts/v012-endless-combat-sim.cjs
      - .github/workflows/v012-endless-research.yml
  workflow_dispatch:
jobs:
  simulated-combat:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 240 real combat runs (no Firebase or live saves)
        run: node scripts/v012-endless-combat-sim.cjs /tmp/wanderer-endless-combat.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v012-endless-combat-matrix
          path: /tmp/wanderer-endless-combat.json

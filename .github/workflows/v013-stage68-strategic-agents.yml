name: Wanderer Stage 6.8 — Strategic build agents (native only, no deploy)
on:
  push:
    branches: [audit/v013-stage6]
    paths:
      - '.github/workflows/v013-stage68-strategic-agents.yml'
      - 'scripts/v013-build-planner.cjs'
      - 'scripts/v013-natural-progression.cjs'
      - 'tests/v013-strategic-build-agents.test.cjs'
      - 'scripts/v013-stage68-agent-evaluation.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Legal native talent builds, actual effects, equipment and game regression
        run: |
          node --check scripts/v013-build-planner.cjs
          node --check scripts/v013-natural-progression.cjs
          node --check scripts/v013-stage68-agent-evaluation.cjs
          node --test \
            tests/v013-strategic-build-agents.test.cjs \
            tests/v013-natural-progression.test.cjs \
            tests/v013-stage65-e1-e10.test.cjs \
            tests/talent-graph-runtime.test.cjs
          git diff --check
  cohorts:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - cohort: physical
            profiles: smart-blood-pure,smart-blood-fury,smart-blood-fury-vitality,smart-fury-blood-aegis
          - cohort: magic
            profiles: smart-magic-arcane-pure,smart-magic-fire-aegis,smart-magic-frost-vitality,smart-magic-lightning-pure
          - cohort: alternatives
            profiles: smart-fury-pure,smart-decay-magic-aegis,smart-aegis-vitality,smart-vitality-pure
          - cohort: weapons
            profiles: smart-blood-sword,smart-blood-two-handed,smart-fury-daggers,smart-fury-bow
          - cohort: potions
            profiles: smart-magic-wand,smart-magic-staff,smart-magic-wand-offense,smart-magic-wand-defense
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Persist actual 4-seed E1–E10 cohorts, no XP/gear injection
        env:
          COHORT: ${{ matrix.cohort }}
          PROFILES: ${{ matrix.profiles }}
        run: |
          mkdir -p reports
          node scripts/v013-natural-progression.cjs \
            --seeds=9701,9702,9703,9704 \
            --profiles="$PROFILES" \
            --max-level=10 \
            --max-attempts=18 \
            --max-total-attempts=85 \
            --out="reports/stage68-$COHORT.json" \
            > "reports/stage68-$COHORT.stdout.txt" 2>&1
          tail -c 6000 "reports/stage68-$COHORT.stdout.txt"
          test -s "reports/stage68-$COHORT.json"
          git diff --exit-code -- combat/ online/ economy/
      - name: Build integrity and reproducibility
        if: always()
        env:
          COHORT: ${{ matrix.cohort }}
        run: |
          {
            echo "revision=$GITHUB_SHA"
            echo "cohort=$COHORT"
            echo "node=$(node --version)"
            sha256sum combat/talent-graph-next.js scripts/v013-build-planner.cjs scripts/v013-natural-progression.cjs
          } > "reports/stage68-$COHORT.provenance.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage68-smart-${{ matrix.cohort }}
          path: reports/stage68-${{ matrix.cohort }}.*
          retention-days: 30
          if-no-files-found: warn
  aggregate:
    needs: cohorts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - uses: actions/download-artifact@v4
        with:
          pattern: stage68-smart-*
          merge-multiple: true
          path: reports
      - name: Audit exact native skill, Affinity, gear and potion trajectories of all 80 accounts
        run: |
          node scripts/v013-stage68-agent-evaluation.cjs \
            reports/stage68-strategic-global.json \
            reports/stage68-physical.json \
            reports/stage68-magic.json \
            reports/stage68-alternatives.json \
            reports/stage68-weapons.json \
            reports/stage68-potions.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage68-strategic-global-audit
          path: |
            reports/stage68-strategic-global.json
            reports/stage68-strategic-global.md
          retention-days: 30
          if-no-files-found: warn

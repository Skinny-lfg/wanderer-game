name: Wanderer Stage 01 — E3 talent validity investigation (no deploy)

on:
  push:
    branches: [audit/v013-stage6]
    paths: ['.github/workflows/v013-stage01-e3-talent.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    if: github.ref == 'refs/heads/audit/v013-stage6'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Talent graph, native stats and prepared Inventory regression
        run: |
          node --check scripts/v013-stage6-e3-repro.cjs
          node --test \
            tests/v013-natural-progression.test.cjs \
            tests/v013-stage01-prepared-stat-breakdown.test.cjs \
            tests/v013-stage6-agent-strategy.test.cjs
      - name: Re-run Daring 9701 all E1–E3 attempts with genuine XP and gear
        run: |
          node scripts/v013-stage6-e3-repro.cjs
          node -e "const r=require('./reports/stage6-e3-repro.json');if(r.errors)throw Error('Native E3 talent error still occurs: '+JSON.stringify(r.attempts.filter(a=>a.error)));console.log('E3_NATIVE_TALENTS_VALIDATED='+JSON.stringify({attempts:r.attempts.length,unlocked:r.unlocked,errors:r.errors,stop:r.stop}));"
      - name: Extended stats, equipment, talent-tree and Pages cache regressions
        run: |
          node --test \
            tests/v013-stat-consistency.test.cjs \
            tests/talent-graph-runtime.test.cjs \
            tests/talent-graph-next.test.cjs \
            tests/talent-graph-combat.test.cjs \
            tests/v0120-equipment.test.cjs \
            tests/v013-offhand-stage2-gear.test.cjs \
            tests/v013-current-dungeon-and-talents.test.cjs
      - name: Multi-build natural E1–E5 progression smoke
        run: |
          node --check scripts/v013-stage01-e3-e5-smoke.cjs
          node scripts/v013-stage01-e3-e5-smoke.cjs
      - name: Archive extended native progression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage01-e3-e5-smoke
          path: reports/stage01-e3-e5-smoke.json
          if-no-files-found: warn
      - name: Preserve diagnostic state even if reproduction fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage01-e3-reproduction
          path: reports/stage6-e3-repro.json
          if-no-files-found: warn
      - run: git diff --check

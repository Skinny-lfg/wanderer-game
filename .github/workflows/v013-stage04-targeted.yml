name: Wanderer Stage 04 — Native AoE/ST, mixed affinities, Elite/Boss targeted audit

on:
  push:
    branches: [audit/v013-stage6]
    paths: ['.github/workflows/v013-stage04-targeted.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.ref == 'refs/heads/audit/v013-stage6'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Native targeted policy, real gear and boss/elite integrity tests
        run: |
          node --check scripts/v013-stage04-run-cohort.cjs
          node --check scripts/v013-stage04-aggregate.cjs
          node --test \
            tests/v013-stage04-targeted-audit.test.cjs \
            tests/v013-stage03-200-accounts.test.cjs \
            tests/v013-natural-progression.test.cjs \
            tests/v013-stage01-prepared-stat-breakdown.test.cjs
      - run: git diff --check

  cohort:
    needs: validate
    if: github.ref == 'refs/heads/audit/v013-stage6'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        seed: [11001, 11002, 11003, 11004, 11005, 11006, 11007, 11008, 11009, 11010, 11011, 11012]
        policy: [adaptive, adaptive-no-targets, adaptive-no-rooms]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Ten fresh native E1–E20 accounts per shared seed and decision policy
        env:
          SEED: ${{ matrix.seed }}
          POLICY: ${{ matrix.policy }}
        run: |
          mkdir -p reports/stage04
          node scripts/v013-stage04-run-cohort.cjs \
            --seed="$SEED" --policy="$POLICY" \
            --out="reports/stage04/raw-$SEED-$POLICY.json"
      - name: Save exact Git revision, Node patch and game/agent file SHA
        if: always()
        env:
          SEED: ${{ matrix.seed }}
          POLICY: ${{ matrix.policy }}
        run: |
          mkdir -p reports/stage04
          {
            echo "revision=$GITHUB_SHA"
            echo "node=$(node --version)"
            echo "cohort=$SEED-$POLICY"
            sha256sum \
              scripts/v013-natural-progression.cjs \
              scripts/v013-agent-strategy.cjs \
              scripts/v013-stage04-run-cohort.cjs \
              scripts/v013-stage04-aggregate.cjs \
              tests/v012-economy-harness.cjs \
              combat/v012-gear-stats.js
          } > "reports/stage04/raw-$SEED-$POLICY.provenance.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage04-native-${{ matrix.seed }}-${{ matrix.policy }}
          path: reports/stage04/raw-${{ matrix.seed }}-${{ matrix.policy }}.*
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: [validate, cohort]
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Collect all 36 native progression shards
        uses: actions/download-artifact@v4
        with:
          pattern: stage04-native-*
          path: reports/stage04
          merge-multiple: true
      - name: Validate 360 actual accounts and compute AoE/ST/mixed/Boss/Elite outcomes
        run: |
          node scripts/v013-stage04-aggregate.cjs \
            reports/stage04 reports/stage04/stage04-targeted.json
      - name: Preserve full detailed report and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage04-targeted-360-consolidated
          path: reports/stage04/stage04-targeted.*
          if-no-files-found: warn
          retention-days: 30
      - run: git diff --check

name: Wanderer Stage 6.7 — Native E6-E10 enemy scaling sweep (NO DEPLOY)
on:
  push:
    branches: [audit/v013-stage6]
    paths:
      - '.github/workflows/v013-stage67-curve-sweep.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Prove original source unchanged, E1–E5 identity and E6+ curve ordering
        run: |
          node --check scripts/v013-stage67-enemy-curve-sweep.cjs
          node --check scripts/v013-stage67-compare-curves.cjs
          node --test tests/v013-stage67-curves.test.cjs tests/v013-stage66-expedition-audit.test.cjs
          git diff --check
  cohorts:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - cohort: physical
            profiles: balanced,cautious,plate-warden,leather-duelist
          - cohort: magic
            profiles: magic-fire,magic-frost,magic-lightning,magic-arcane
          - cohort: mixed
            profiles: magic-wand,magic-staff,cloth-battlemage,hexblade-hybrid
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Test current versus mild, firm and linear E6+ curves using genuine persistent native accounts
        env:
          COHORT: ${{ matrix.cohort }}
          PROFILES: ${{ matrix.profiles }}
        run: |
          mkdir -p reports
          node scripts/v013-stage67-enemy-curve-sweep.cjs \
            --seeds=9701,9702,9703,9704 \
            --profiles="$PROFILES" \
            --out-prefix="reports/stage67-$COHORT" \
            | tee "reports/stage67-$COHORT.stdout.txt"
          test -s "reports/stage67-$COHORT-summary.json"
          git diff --exit-code -- combat/expedition-progression.js combat/v012-combat-core.js combat/v012-combat-runtime.js
      - name: Preserve exact source and runner provenance
        if: always()
        env:
          COHORT: ${{ matrix.cohort }}
        run: |
          {
            echo "revision=$GITHUB_SHA"
            echo "node=$(node --version)"
            echo "cohort=$COHORT"
            sha256sum combat/expedition-progression.js scripts/v013-stage67-enemy-curve-sweep.cjs \
              scripts/v013-natural-progression.cjs
          } > "reports/stage67-$COHORT.provenance.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage67-native-${{ matrix.cohort }}
          path: reports/stage67-${{ matrix.cohort }}*
          retention-days: 30
          if-no-files-found: warn
  aggregate:
    needs: cohorts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - uses: actions/download-artifact@v4
        with:
          pattern: stage67-native-*
          merge-multiple: true
          path: reports
      - name: Confirm the Stage 6.5 baseline and compare all 48 paired native accounts
        run: |
          node scripts/v013-stage67-compare-curves.cjs \
            reports/stage67-global-comparison.json \
            reports/stage67-physical-summary.json \
            reports/stage67-magic-summary.json \
            reports/stage67-mixed-summary.json
      - name: Preserve full comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage67-native-scaling-comparison
          path: |
            reports/stage67-global-comparison.json
            reports/stage67-global-comparison.md
          retention-days: 30
          if-no-files-found: warn

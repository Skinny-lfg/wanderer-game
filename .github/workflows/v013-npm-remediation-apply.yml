name: Wanderer v0.13 apply tested npm remediation (no deploy)
on:
  push:
    branches: [audit/v013]
    paths: ['.github/workflows/v013-npm-remediation-apply.yml']
permissions:
  contents: write
jobs:
  apply-tested-lockfile:
    if: github.ref == 'refs/heads/audit/v013'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Update Firebase CLI and safe transitive dependency patches only
        run: |
          npm install --package-lock-only --ignore-scripts --save-dev firebase-tools@15.37.0
          npm audit fix --package-lock-only --ignore-scripts || true
      - name: Verify security reduction before accepting changes
        run: |
          npm audit --package-lock-only --json > /tmp/wanderer-full-audit.json || true
          npm audit --omit=dev --package-lock-only --json > /tmp/wanderer-production-audit.json || true
          node <<'NODE'
          const fs=require('node:fs');
          const f=JSON.parse(fs.readFileSync('/tmp/wanderer-full-audit.json','utf8'));
          const p=JSON.parse(fs.readFileSync('/tmp/wanderer-production-audit.json','utf8'));
          const a=f.metadata?.vulnerabilities,b=p.metadata?.vulnerabilities;
          console.log('FULL_AUDIT_COUNTS',JSON.stringify(a));
          console.log('PRODUCTION_AUDIT_COUNTS',JSON.stringify(b));
          if(!a||!b||a.critical!==0||a.total>19||b.critical!==0||b.total>4)throw Error('The remediation did not meet pre-validated security limits');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(pkg.dependencies?.firebase!=='11.10.0')throw Error('Do not silently update browser SDK');
          if(!pkg.devDependencies?.['firebase-tools']?.includes('15.37.0'))throw Error('Firebase CLI is not the expected tested version');
          NODE
      - name: Reinstall from lockfile and compile browser SDK offline
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:firebase
      - name: Run current gameplay, talents, simulation, and legacy safeguards
        run: |
          node scripts/v013-c6-final-audit.cjs
          npm run test:v013:gate
          npm run test:v013:talent-graph
      - name: Verify Firebase rules and authentication via emulators only
        run: npm run test:rules
      - name: Commit only validated dependency manifests to isolated audit branch
        shell: bash
        run: |
          git add -- package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'security(v013): patch npm lock and upgrade Firebase CLI without connecting production'
          git push origin HEAD:refs/heads/audit/v013

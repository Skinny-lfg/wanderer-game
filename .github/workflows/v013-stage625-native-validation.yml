name: Wanderer Stage 6.25 — Native Rare/Epic enemy validation (NO DEPLOY)
on:
  push:
    branches: [audit/v013-stage625-validation-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - name: Read-only harness and native balance regression gates
        run: |
          node --check scripts/v013-stage625-native-validation.cjs
          node --test tests/v013-stage624c-progression.test.cjs tests/v013-stage624b-balance.test.cjs tests/v013-stage615-enemy-hierarchy.test.cjs
          npm run test:v013:gate
          git diff --check
      - name: Confirm six Affinities / legal four-seed cohorts and expected gear tier
        run: |
          node - <<'NODE'
          const v=require('./scripts/v013-stage625-native-validation.cjs');
          for(const E of [35,70,200])for(const rarity of ['Rare','Epic']){
            const p=v.options(E,rarity);
            if(p.rows.length!==48||new Set(p.rows.map(x=>x.seed)).size!==48||
              new Set(p.rows.map(x=>x.realm)).size!==6||
              p.rows.some(x=>x.budget!==(E===35?36:60)))
              throw Error('Invalid controlled Stage 6.25 '+E+'/'+rarity);
          }
          console.log('STAGE625_PREFLIGHT: 6 legal controlled cohorts, no gameplay changes');
          NODE
  native:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        level: [35,70,200]
        rarity: [Rare,Epic]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - name: Real native 8-Elite six-Boss and 1/3/6/12 mob encounters
        run: >-
          node scripts/v013-stage625-native-validation.cjs
          --level=${{ matrix.level }}
          --rarity=${{ matrix.rarity }}
          --seeds=4
          --out=reports/stage625-E${{ matrix.level }}-${{ matrix.rarity }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage625-E${{ matrix.level }}-${{ matrix.rarity }}
          path: reports/stage625-E${{ matrix.level }}-${{ matrix.rarity }}.json
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: stage625-E*
          path: reports/stage625-shards
          merge-multiple: true
      - name: Validate all six cohorts and report individual enemies, Realms and armor
        run: >-
          node scripts/v013-stage625-native-validation.cjs
          --aggregate-dir=reports/stage625-shards
          --out=reports/v013-stage625-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: stage625-native-aggregate
          path: |
            reports/v013-stage625-summary.json
            reports/v013-stage625-summary.md
          if-no-files-found: error
          retention-days: 30
  earned:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: [9761,9762]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - name: Earned E1–E20 progression with real loot, decisions, XP and adaptive extraction
        run: >-
          node scripts/v013-natural-progression.cjs
          --seeds=${{ matrix.seed }}
          --profiles=cautious,balanced,magic-fire,leather-duelist
          --max-level=20
          --max-attempts=6
          --max-total-attempts=80
          --out=reports/stage625-natural-${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage625-natural-${{ matrix.seed }}
          path: reports/stage625-natural-${{ matrix.seed }}.json
          if-no-files-found: warn
          retention-days: 30

name: Build v0.13 Camp preview (temporary)
on:
  pull_request:
    branches:
      - publish/automatic-rpg-preview
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v013-stage74-camp-talents-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Focused Camp tests
        run: npm run test:v013:stage71 && node --test tests/automatic-preview.test.cjs
      - name: Regenerate isolated GitHub Pages docs
        run: npm run build:pages
      - name: Verify v10 preview UI and no Firebase login
        run: |
          test -f docs/index.html
          grep -q "PREFIX='wanderer_automatic_rpg_preview_v10_'" docs/online/v012-save.js
          grep -q 'phase3ExpeditionSelector' docs/index.html
          grep -q 'phase3BlueprintCompact' docs/index.html
          grep -q 'data-phase3-expedition-step' docs/index.html
          ! grep -q 'starterPoints:2' docs/online/v012-expedition-runtime.js
          ! grep -q 'src="online/v012-account.mjs"' docs/index.html
          ! grep -q 'src="online/firebase-client.mjs"' docs/index.html
      - name: Commit regenerated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs
          if ! git diff --cached --quiet; then
            git commit -m "Build v0.13 Camp fixes with isolated v10 preview [skip ci]"
            git push origin HEAD:refs/heads/feature/v013-stage74-camp-talents-20261118
          fi

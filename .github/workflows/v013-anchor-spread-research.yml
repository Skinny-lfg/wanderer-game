name: Anchor DoT Full-Potency Spread Research (NO DEPLOY)
on:
  push:
    branches: [balance/stage-6.40-e1-calibration]
    paths: ['scripts/v013-anchor-spread-research.cjs','.github/workflows/v013-anchor-spread-research.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node scripts/v013-anchor-spread-research.cjs smoke
      - run: npm run test:v013:sim
  compare:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [decay-cycle-wand, hybrid-magic-decay, hybrid-decay-blood, blood-spread-twohand, magic-fire-wand]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node scripts/v013-anchor-spread-research.cjs ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: anchor-spread-${{ matrix.profile }}
          path: reports/anchor-spread-research/*.json
  summary:
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: anchor-spread-*
          path: reports/anchor-spread-research
          merge-multiple: true
      - run: node scripts/v013-anchor-spread-research.cjs aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: anchor-spread-summary
          path: reports/anchor-spread-research/summary.json

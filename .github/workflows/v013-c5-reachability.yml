name: Wanderer C5 old-route-and-talent reachability (audit only)
on:
  push:
    branches: [audit/v013]
    paths: ['.github/workflows/v013-c5-reachability.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  find-legacy-references:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Catalog legacy imports and controllers (source/tests/scripts, no docs mirror)
        shell: bash
        run: |
          echo '=== OLDER TALENT SCRIPT REFERENCES ==='
          grep -R -n -E --include='*.js' --include='*.mjs' --include='*.cjs' --include='*.html' --include='*.yml' 'automatic-talents[.]js|v013-legacy-fixture[.]cjs|legacyTopology|legacyBasic|legacyFocused|legacyV14' combat online preview index.html tests scripts .github || true
          echo '=== ROUTE GENERATOR REFERENCES ==='
          grep -R -n -E --include='*.js' --include='*.mjs' --include='*.cjs' --include='*.html' 'routeMap|routeMobCounts|rerollsByRealm|planAffinities|chooseInitial\(|phase1Controller[.](select|allowed|influence|reachable|reroll)\(' combat online preview index.html tests scripts | head -110 || true

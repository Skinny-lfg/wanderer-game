name: Stage 8.0 isolated preview builder (temporary)
on:
  pull_request:
    branches:
      - publish/automatic-rpg-preview
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v013-stage80-enemy-roster-20261118
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test current enemy roster and isolated preview
        run: npm run test:v013:stage80 && node --test tests/automatic-preview.test.cjs
      - name: Build isolated GitHub Pages
        run: npm run build:pages
      - name: Verify all new preview artifacts and Firebase isolation
        run: |
          test -f docs/online/v013-enemy-roster.js
          grep -q 'CATALOG=Object.freeze' docs/online/v013-enemy-roster.js
          grep -q "PREFIX='wanderer_automatic_rpg_preview_v12_'" docs/online/v012-save.js
          grep -q 'enemyRoleBadge' docs/index.html
          grep -q 'online/v013-enemy-roster.js?v=' docs/index.html
          grep -q 'normalCount=' docs/online/v013-enemy-roster.js
          ! grep -q 'src="online/v012-account.mjs"' docs/index.html
          ! grep -q 'src="online/firebase-client.mjs"' docs/index.html
      - name: Commit generated docs to PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs
          if ! git diff --cached --quiet; then
            git commit -m "Build Stage 8.0 isolated v0.13 Pages preview [skip ci]"
            git push origin HEAD:refs/heads/feature/v013-stage80-enemy-roster-20261118
          fi

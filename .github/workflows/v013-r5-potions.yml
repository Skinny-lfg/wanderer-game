name: v0.13 R5 - potion runtime
on:
  push:
    branches: [release/v013-consolidated]
    paths: ['online/v012-consumables.js','tests/v013-r5-potions.test.cjs','.github/workflows/v013-r5-potions.yml','combat/v012-combat-runtime.js','economy/v012-equipment-runtime.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  directed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/v013-r5-potions.test.cjs tests/v012-complete-potions.test.cjs tests/v013-stage74-potions.test.cjs tests/v012-unified-gear-potions.test.cjs tests/v012-economy.test.cjs tests/v013-dungeon-checkpoint-integrity.test.cjs tests/v013-stage7-contracts.test.cjs

name: Wanderer Stage 03 — E8 native Stash regression preflight (no deploy)

on:
  push:
    branches: [audit/v013-stage6]
    paths: ['.github/workflows/v013-stage03-e8-preflight.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    if: github.ref == 'refs/heads/audit/v013-stage6'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Verify native potion occupancy and honest recovery-starter preservation
        run: |
          node --check scripts/v013-natural-progression.cjs
          node --test tests/v013-stage03-200-accounts.test.cjs
      - name: Replay complete seed 9902 from genuine E1 with all ten profiles
        run: |
          node scripts/v013-stage03-run-seed.cjs \
            --seed=9902 \
            --out=reports/stage03/raw-9902.json
      - name: Export native account paths and original errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage03-e8-stash-preflight-9902
          path: reports/stage03/raw-9902.*
          retention-days: 30
          if-no-files-found: ignore
      - run: git diff --check

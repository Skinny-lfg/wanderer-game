name: Wanderer — Off-Hand Dagger strikes with every one-handed main weapon

on:
  push:
    branches: [audit/v013-stage6]
    paths: ['.github/workflows/v013-offhand-dagger-any-main.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat-regression:
    if: github.ref == 'refs/heads/audit/v013-stage6'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Check source, published files, and native combat engine
        run: |
          node --check combat/v012-combat-runtime.js
          node --check docs/combat/v012-combat-runtime.js
          node --test \
            tests/v013-offhand-dagger-any-main.test.cjs \
            tests/v013-gear-loot-daggers.test.cjs \
            tests/v013-expedition-dagger-forge.test.cjs \
            tests/v013-offhand-stage2-gear.test.cjs \
            tests/v013-stage04-archetype-refinement.test.cjs \
            tests/v013-natural-progression.test.cjs
      - name: Verify clean patch
        run: git diff --check

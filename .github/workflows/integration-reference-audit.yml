name: Verify integration reference drift
on:
  push:
    branches: [development]
    paths: [.github/workflows/integration-reference-audit.yml]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify trace stability and D7 metrics
        run: node scripts/v012-integration-reference-audit.cjs

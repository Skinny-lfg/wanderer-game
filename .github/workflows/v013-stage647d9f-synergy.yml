name: Stage 6.48A.1 — Audited E10 balance matrix (NO DEPLOY)
on:
  push:
    branches: [balance/stage-6.40-e1-calibration]
    paths: ['.github/workflows/v013-stage647d9f-synergy.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node scripts/v013-stage647d9f-synergy.cjs selftest
      - run: node --test tests/v013-stage647d9f1-synergy.test.cjs tests/v013-stage647d9e-stat-identity.test.cjs tests/talent-graph-combat.test.cjs
      - run: node --test tests/v013-stage83-boss-infrastructure.test.cjs tests/v013-stage84-six-bosses.test.cjs tests/v013-stage648a1-audit.test.cjs
      - run: npm test
      - run: node scripts/v013-stage647d9f-synergy.cjs smoke
  cohort:
    needs: regression
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        profile: [cautious, balanced, plate-warden, cloth-battlemage, leather-duelist, hexblade-hybrid, smart-blood-pure, smart-blood-two-handed, smart-fury-bow, smart-fury-daggers, smart-radiance-pure, smart-aegis-radiance, smart-arcane-arcane-pure, smart-arcane-fire-pure, arcane-frost, smart-arcane-lightning-pure, smart-decay-arcane-aegis, decay-blood-spread, smart-blood-sword, smart-blood-fury, smart-blood-fury-radiance, smart-blood-fury-radiance-no-mixed, smart-fury-blood-aegis, smart-fury-pure, smart-arcane-fire-aegis, smart-arcane-frost-radiance, smart-arcane-wand, smart-arcane-staff, smart-arcane-wand-offense, smart-arcane-wand-defense, decay-sword, decay-daggers, decay-wand, decay-staff, decay-two-handed, aegis-sword-shield, aegis-mace-shield, aegis-wand-orb, radiance-sword-charm, radiance-staff, arcane-sword-infusion, arcane-daggers-infusion]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node scripts/v013-stage647d9f-synergy.cjs run ${{ matrix.profile }} 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synergy-${{ matrix.profile }}
          path: reports/stage647d9f/*.json
  aggregate:
    needs: [regression, cohort]
    if: ${{ always() && needs.regression.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: synergy-*
          path: reports/stage647d9f
          merge-multiple: true
      - run: node scripts/v013-stage647d9f-synergy.cjs aggregate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage647d9f-synergy-report
          path: reports/v013-stage647d9f-synergy.json

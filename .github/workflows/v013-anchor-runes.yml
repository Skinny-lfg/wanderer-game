name: Anchor Runes native integration (NO DEPLOY)
on:
  push:
    branches: [balance/stage-6.40-e1-calibration]
    paths: ['.github/workflows/v013-anchor-runes.yml','tests/v012-complete-runes.test.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node --test tests/v012-complete-runes.test.cjs tests/v0120-rune-checkpoint.test.cjs tests/v013-armor-rotguard.test.cjs
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm test

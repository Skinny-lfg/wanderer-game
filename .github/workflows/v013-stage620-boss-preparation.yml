name: Wanderer Stage 6.20 — Six prepared Bosses, native effects, NO DEPLOY
on:
  push:
    branches:
      - audit/v013-stage620-boss-preparation-20261121
    paths:
      - '.github/workflows/v013-stage620-boss-preparation.yml'
      - 'scripts/v013-stage620-boss-preparation.cjs'
      - 'tests/v013-stage620-boss-preparation.test.cjs'
      - 'online/v013-boss-abilities.js'
      - 'combat/v012-combat-runtime.js'
      - 'scripts/simulate-progression.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.5', cache: npm}
      - run: npm ci
      - name: Native Boss preparation, six abilities and Elite regression tests
        run: |
          node --check scripts/v013-stage620-boss-preparation.cjs
          node --check tests/v013-stage620-boss-preparation.test.cjs
          node --test tests/v013-stage620-boss-preparation.test.cjs tests/v013-boss-preparation-runtime.test.cjs tests/v013-boss-preparation.test.cjs
          node --test tests/v013-stage84-six-bosses.test.cjs tests/v013-stage83-boss-infrastructure.test.cjs
          node --test tests/v013-stage619-elite-balance.test.cjs tests/v013-stage618-mob-implementation.test.cjs
          npm run test:v013:integration
          git diff --check
      - name: 96 matched native players x four preparation strategies = 384 Boss fights
        run: node scripts/v013-stage620-boss-preparation.cjs --mode=pilot --seeds-per-cell=1 --out=reports/v013-stage620-boss-preparation-pilot.json
      - name: Save pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage620-pilot-384-native-preparation-boss-fights
          path: |
            reports/v013-stage620-boss-preparation-pilot.json
            reports/v013-stage620-boss-preparation-pilot.md
          if-no-files-found: warn
          retention-days: 30
  full:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.23.5', cache: npm}
      - run: npm ci
      - name: 192 matched native players x four preparation strategies = 768 Boss fights
        run: node scripts/v013-stage620-boss-preparation.cjs --mode=matrix --seeds-per-cell=2 --out=reports/v013-stage620-boss-preparation-matrix.json
      - name: Save full native Boss evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage620-full-768-native-preparation-boss-fights
          path: |
            reports/v013-stage620-boss-preparation-matrix.json
            reports/v013-stage620-boss-preparation-matrix.md
          if-no-files-found: warn
          retention-days: 30

name: Wanderer Stage 6.17 — Native mob roster-rule ablation (NO DEPLOY)
on:
  push:
    branches:
      - audit/v013-stage617-roster-ablation-20261121
    paths:
      - '.github/workflows/v013-stage617-roster-ablation.yml'
      - 'scripts/v013-stage617-roster-ablation.cjs'
      - 'scripts/simulate-progression.cjs'
      - 'tests/v013-stage617-roster-ablation.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Syntax and strict matched native-variant tests
        run: |
          node --check scripts/simulate-progression.cjs
          node --check scripts/v013-stage617-roster-ablation.cjs
          node --check tests/v013-stage617-roster-ablation.test.cjs
          node --test tests/v013-stage617-roster-ablation.test.cjs tests/v013-stage616-encounter-types.test.cjs
          git diff --check
      - name: 96 paired native heroes x 5 test arms = 480 native fights
        run: node scripts/v013-stage617-roster-ablation.cjs --mode=pilot --seeds-per-cell=2 --out=reports/v013-stage617-roster-pilot.json
      - name: Save pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage617-pilot-480-native-4to6-ablation-fights
          path: |
            reports/v013-stage617-roster-pilot.json
            reports/v013-stage617-roster-pilot.md
          retention-days: 30
          if-no-files-found: warn
  full:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: 192 paired native heroes x 5 test arms = 960 native fights
        run: node scripts/v013-stage617-roster-ablation.cjs --mode=matrix --seeds-per-cell=4 --out=reports/v013-stage617-roster-matrix.json
      - name: Save full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage617-full-960-native-4to6-ablation-fights
          path: |
            reports/v013-stage617-roster-matrix.json
            reports/v013-stage617-roster-matrix.md
          retention-days: 30
          if-no-files-found: warn

name: Publish Wanderer v0.12 to production Firebase Hosting

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY wanderer-play to authorize this production Hosting deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wanderer-production-hosting
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/development' && inputs.confirmation == 'DEPLOY wanderer-play' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Checkout development
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Firebase SDK bundle
        run: npm run build:firebase

      - name: Run release tests
        run: npm test

      - name: Prepare production-only website
        env:
          FIREBASE_PROJECT_ID: wanderer-play
          PUBLISH_PRODUCTION: ${{ inputs.confirmation }}
        run: node scripts/prepare-hosting-production.mjs

      - name: Prepare Hosting-only configuration (never deploy Firestore Rules)
        run: |
          cat > firebase.json <<'JSON'
          {
            "hosting": {
              "public": "hosting-dist",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "headers": [
                { "source": "**/*.html", "headers": [{ "key": "Cache-Control", "value": "no-cache, max-age=0, must-revalidate" }] },
                { "source": "/online/firebase-config.mjs", "headers": [{ "key": "Cache-Control", "value": "no-store" }] }
              ]
            }
          }
          JSON

      - name: Verify production service account secret
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WANDERER_PLAY }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_WANDERER_PLAY GitHub secret"
            exit 1
          fi
          node --input-type=module -e "const c=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);if(c.type!=='service_account'||c.project_id!=='wanderer-play')throw Error('Wrong production service account project')"

      - name: Prepare Hosting-only configuration (never deploy Firestore Rules)
        run: |
          cat > firebase-hosting.json <<'JSON'
          {
            "hosting": {
              "public": "hosting-dist",
              "ignore": ["firebase.json", "firebase-hosting.json", "**/.*", "**/node_modules/**"],
              "headers": [
                { "source": "**/*.html", "headers": [{ "key": "Cache-Control", "value": "no-cache, max-age=0, must-revalidate" }] },
                { "source": "/online/firebase-config.mjs", "headers": [{ "key": "Cache-Control", "value": "no-store" }] }
              ]
            }
          }
          JSON

      - name: Deploy production Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WANDERER_PLAY }}
          projectId: wanderer-play
          channelId: live

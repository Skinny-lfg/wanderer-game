name: Development regression tests
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: New Expedition buildcraft, events and controller
        run: node tests/v012-buildcraft.test.cjs && node tests/v012-events.test.cjs && node tests/v012-expedition-controller.test.cjs
      - run: npm test
      - name: Shatter and Double Strike isolated A/B
        run: node tests/v093-shatter-double-strike.cjs

  # Intentionally opt-in: normal development pushes keep the fast smoke check.
  # Add [audit] to a development commit message to run the full pre-release suite.
  prerelease-audit:
    if: contains(github.event.head_commit.message, '[audit]') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[audit]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WANDERER_TEST_URL: http://127.0.0.1:8012
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Verify Firebase SDK build
        run: npm run build:firebase
      - name: Prepare headless browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            sudo ln -sf "$(command -v google-chrome)" /usr/bin/chromium
          else
            npx playwright install --with-deps chromium
            CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -n 1)"
            test -n "$CHROME"
            sudo ln -sf "$CHROME" /usr/bin/chromium
          fi
          /usr/bin/chromium --version
      - name: Start isolated local test server
        run: |
          python3 -m http.server 8012 --bind 127.0.0.1 >/tmp/wanderer-audit-http.log 2>&1 &
          echo $! >/tmp/wanderer-audit-http.pid
          sleep 2
          curl --fail http://127.0.0.1:8012/ >/dev/null
      - name: Isolated v0.12 event Expedition browser
        id: events
        continue-on-error: true
        timeout-minutes: 4
        run: node tests/v012-events-browser.cjs
      - name: Browser asset and VFX checks
        id: assets
        continue-on-error: true
        timeout-minutes: 4
        run: npm run test:assets
      - name: Unit and smoke regression
        id: unit
        continue-on-error: true
        run: npm test
      - name: Browser gameplay and mobile stress
        id: stressbrowser
        continue-on-error: true
        timeout-minutes: 8
        run: node tests/stress-browser.cjs
      - name: Browser account and save flows
        id: browser
        continue-on-error: true
        timeout-minutes: 6
        run: npm run test:browser
      - name: Interrupted save and conflict recovery
        id: recovery
        continue-on-error: true
        timeout-minutes: 5
        run: npm run test:recovery
      - name: Deterministic combat and save stress
        id: stress
        continue-on-error: true
        timeout-minutes: 7
        run: node tests/stress-combat.cjs && node tests/stress-save-gameplay.cjs
      - name: PvP browser regressions
        id: pvp
        continue-on-error: true
        timeout-minutes: 4
        run: npm run test:pvp
      - name: Firestore rules in demo emulator ONLY
        id: rules
        continue-on-error: true
        timeout-minutes: 8
        run: npm run test:rules
      - name: Pre-release audit result gate
        if: always()
        run: |
          echo "Events:   ${{ steps.events.outcome }}"
          echo "Unit:     ${{ steps.unit.outcome }}"
          echo "Browser:  ${{ steps.browser.outcome }}"
          echo "Assets:   ${{ steps.assets.outcome }}"
          echo "Recovery: ${{ steps.recovery.outcome }}"
          echo "Stress:   ${{ steps.stress.outcome }}"
          echo "Stress UI:${{ steps.stressbrowser.outcome }}"
          echo "PvP:      ${{ steps.pvp.outcome }}"
          echo "Rules:    ${{ steps.rules.outcome }}"
          for result in "${{ steps.events.outcome }}" "${{ steps.unit.outcome }}" "${{ steps.browser.outcome }}" "${{ steps.assets.outcome }}" "${{ steps.recovery.outcome }}" "${{ steps.stress.outcome }}" "${{ steps.stressbrowser.outcome }}" "${{ steps.pvp.outcome }}" "${{ steps.rules.outcome }}"; do
            test "$result" = success || exit 1
          done

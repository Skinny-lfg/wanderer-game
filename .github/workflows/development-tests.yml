name: Development v0.12 checks
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

jobs:
  current-expedition:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Current v0.12 Expedition, save and safety tests
        run: npm test
      - name: Keep PvP stats extractor consistent
        run: node scripts/build-pvp-stats.cjs --check

  full-playtest-audit:
    if: contains(github.event.head_commit.message, '[audit]') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[audit]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WANDERER_TEST_URL: http://127.0.0.1:8012
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            sudo ln -sf "$(command -v google-chrome)" /usr/bin/chromium
          else
            npx playwright install --with-deps chromium
            CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -o -path '*/chrome-linux/chrome' | head -n 1)"
            test -n "$CHROME"
            sudo ln -sf "$CHROME" /usr/bin/chromium
          fi
          /usr/bin/chromium --version
      - name: Start isolated local web server
        run: |
          python3 -m http.server 8012 --bind 127.0.0.1 >/tmp/wanderer-v012-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8012/ >/dev/null
      - name: Current Expedition mobile/desktop browser tests
        run: npm run test:browser
      - name: Current equipment VFX/asset tests
        run: npm run test:assets
      - name: Focused E10/E50 and three affinity-pair native simulations
        run: node scripts/v012-focused-build-sim.cjs /tmp/wanderer-v012-focused-builds.json
      - name: Native v0.12 combat/loot simulations
        run: npm run simulate:v012

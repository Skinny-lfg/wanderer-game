name: Development v0.12 checks
on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

jobs:
  current-expedition:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Current v0.12 Expedition, save and safety tests
        run: npm test
      - name: Keep PvP stats extractor consistent
        run: node scripts/build-pvp-stats.cjs --check

  full-playtest-audit:
    if: contains(github.event.head_commit.message, '[audit]') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[audit]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WANDERER_TEST_URL: http://127.0.0.1:8012
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare Chromium
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            sudo ln -sf "$(command -v google-chrome)" /usr/bin/chromium
          else
            npx playwright install --with-deps chromium
            CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -o -path '*/chrome-linux/chrome' | head -n 1)"
            test -n "$CHROME"
            sudo ln -sf "$CHROME" /usr/bin/chromium
          fi
          /usr/bin/chromium --version
      - name: Start isolated local web server
        run: |
          python3 -m http.server 8012 --bind 127.0.0.1 >/tmp/wanderer-v012-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8012/ >/dev/null
      - name: Current Expedition mobile/desktop browser tests
        run: npm run test:browser
      - name: Current equipment VFX/asset tests
        run: npm run test:assets
      - name: Focused E10/E50 and three affinity-pair native simulations
        run: node scripts/v012-focused-build-sim.cjs /tmp/wanderer-v012-focused-builds.json
      - name: Native v0.12 combat/loot simulations
        run: npm run simulate:v012


  utility-coverage-ab-audit:
    if: contains(github.event.head_commit.message, '[coverage]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated paired utility-coverage simulations
        env:
          WANDERER_COVERAGE_LEVELS: '50,200'
          WANDERER_COVERAGE_REPETITIONS: '12'
          WANDERER_COVERAGE_SEED_OFFSET: '17000000'
        run: node scripts/v012-coverage-ab-sim.cjs /tmp/wanderer-v012-coverage-ab.json
      - name: Archive coverage comparison and full trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wanderer-coverage-ab-${{ github.sha }}
          path: /tmp/wanderer-v012-coverage-ab.json
          if-no-files-found: ignore


  armor-archetype-audit:
    if: contains(github.event.head_commit.message, '[archetype]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate real full Cloth Leather Plate with targeted triple affinities
        env:
          WANDERER_ARCH_REPETITIONS: '8'
          WANDERER_ARCH_SEED_OFFSET: '29000000'
        run: node scripts/v012-armor-archetypes-sim.cjs /tmp/wanderer-v012-armor-archetypes.json
      - name: Archive per-seed gear and build simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wanderer-armor-archetypes-${{ github.sha }}
          path: /tmp/wanderer-v012-armor-archetypes.json
          if-no-files-found: ignore


  legendary-prototype-audit:
    if: contains(github.event.head_commit.message, '[legendary]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulate all 12 prototype Legendaries in memory only
        env:
          WANDERER_LEGEND_LEVELS: '50,200'
          WANDERER_LEGEND_REPS: '12'
          WANDERER_LEGEND_SOLO_REPS: '1'
          WANDERER_LEGEND_SEED_OFFSET: '93000000'
        run: node scripts/v012-legendary-build-ab-sim.cjs /tmp/wanderer-v012-legendary-test.json
      - name: Archive complete Legendary A/B trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wanderer-legendary-prototypes-${{ github.sha }}
          path: /tmp/wanderer-v012-legendary-test.json
          if-no-files-found: ignore

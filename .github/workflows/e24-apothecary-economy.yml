name: E.2.4 Apothecary native economy verification
on:
  push:
    branches: [development]
    paths: [.github/workflows/e24-apothecary-economy.yml]
  workflow_dispatch:
jobs:
  apothecary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native potion purchase and return assertions
        run: node scripts/v012-phase-e24-apothecary-economy.cjs

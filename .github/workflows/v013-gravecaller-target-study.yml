name: Wanderer v0.13 — Gravecaller target strategy A/B (no deploy)

on:
  pull_request:
    paths:
      - 'scripts/v013-gravecaller-target-study.cjs'
      - 'scripts/v013-elite-tank-parity.cjs'
      - 'scripts/v013-natural-progression.cjs'
      - 'tests/v013-gravecaller-target-study.test.cjs'
      - 'package.json'
      - '.github/workflows/v013-gravecaller-target-study.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify real summoned-undead target selection and fixture invariants
        run: >-
          node --test
          tests/v013-gravecaller-target-study.test.cjs
          tests/v013-stage95-elite-parity.test.cjs

  paired-native-study:
    needs: strategy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gear: [starter, common]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Thirty genuine same-seed Gravecaller combats — leader focus vs Minions first
        run: >-
          npm run diagnose:v013:gravecaller-target --
          --gear=${{ matrix.gear }}
          --target=30 --scan=3600 --seed-start=16001
          --out=reports/gravecaller-target-${{ matrix.gear }}.json
      - name: Upload complete A/B combat evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravecaller-target-${{ matrix.gear }}
          path: |
            reports/gravecaller-target-${{ matrix.gear }}.json
            reports/gravecaller-target-${{ matrix.gear }}.md
          if-no-files-found: warn
          retention-days: 60

name: Stage 6.47D — Interactive talent layout preview (NO DEPLOY)
on:
  push:
    branches: [balance/stage-6.40-e1-calibration]
    paths: ['.github/workflows/v013-stage647d-layout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node scripts/prepare-stage647d-layout.cjs
      - run: npx playwright install --with-deps chromium
      - name: Real Chromium layout and graph contracts
        run: |
          node <<'JS'
          const fs=require('node:fs'),path=require('node:path'),http=require('node:http'),assert=require('node:assert/strict');
          const {execFileSync}=require('node:child_process'),{chromium}=require('playwright');
          (async()=>{
            const out=path.resolve('reports/stage647d-layout'),prefix='Isolated automatic RPG preview: ';
            const preview=execFileSync(process.execPath,['scripts/prepare-automatic-preview.mjs'],{encoding:'utf8'}).trim();
            assert(preview.startsWith(prefix));const root=path.resolve(preview.slice(prefix.length));
            for(const f of ['index.html','prototype.js'])fs.copyFileSync(path.join(out,f),path.join(root,'preview/talent-rebuild',f));
            const mime={'.html':'text/html; charset=utf-8','.js':'text/javascript','.mjs':'text/javascript','.css':'text/css','.json':'application/json','.png':'image/png','.jpg':'image/jpeg','.webp':'image/webp','.svg':'image/svg+xml','.woff2':'font/woff2','.woff':'font/woff','.ttf':'font/ttf','.gif':'image/gif'};
            const server=http.createServer((req,res)=>{
              const u=new URL(req.url,'http://127.0.0.1'),f=path.resolve(root,'.'+(u.pathname==='/'?'/index.html':decodeURIComponent(u.pathname)));
              if(!f.startsWith(root+path.sep))return res.writeHead(403).end();
              fs.readFile(f,(err,data)=>{if(err)return res.writeHead(404).end();res.writeHead(200,{'Content-Type':mime[path.extname(f)]||'application/octet-stream'}).end(data);});
            });
            await new Promise(r=>server.listen(0,'127.0.0.1',r));
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:1920,height:1080},deviceScaleFactor:1});
              const errors=[];page.on('pageerror',e=>errors.push(e.message));
              await page.goto('http://127.0.0.1:'+server.address().port,{waitUntil:'load'});
              await page.getByRole('button',{name:'Talents',exact:true}).click();
              const frame=page.frameLocator('iframe[title="Talent tree"]');
              await frame.locator('#nodes .node').first().waitFor({timeout:30000});
              const metrics=await frame.locator('body').evaluate(()=>{
                const {graph,positions}=window.__layout647D;
                const ids=new Set(graph.map(n=>n.id)),original=graph.filter(n=>!n.proposal),newNodes=graph.filter(n=>n.proposal),byId=new Map(graph.map(n=>[n.id,n]));
                if(ids.size!==graph.length)throw Error('Duplicate graph ID');
                for(const n of graph)for(const id of [n.requires,...(n.prerequisites||[]),...(n.anyRequires||[])].filter(Boolean))if(!ids.has(id))throw Error('Missing prerequisite '+id);
                const forks=graph.filter(n=>n.kind==='weapon'),families=WandererTalentGraph.FAMILIES;
                const oldGraph=WandererTalentGraph.createGraph(WandererV012Buildcraft.CATALOG,WandererTalentCatalog.NODES);
                if(JSON.stringify(original)!==JSON.stringify(oldGraph))throw Error('Original graph changed');
                const radius=n=>n.kind==='affinity'?37:n.kind==='choice'?32:n.kind==='mixed'?29:['basic','focused','element','weapon'].includes(n.kind)?23:9;
                const visible=graph.filter(n=>!n.element||n.element==='arcane'),overlaps=[];
                let clearance=Infinity;
                const fork=n=>n.weaponFork||n.gateFor&&byId.get(n.gateFor)?.weaponFork;
                for(let i=0;i<visible.length;i++)for(let j=i+1;j<visible.length;j++){
                  const a=visible[i],b=visible[j];if(!fork(a)&&!fork(b))continue;
                  const p=positions[a.id],q=positions[b.id],d=Math.hypot(p.x-q.x,p.y-q.y)-radius(a)-radius(b);
                  clearance=Math.min(clearance,d);if(d<0)overlaps.push([a.id,b.id,d]);
                }
                const proposed=forks.filter(n=>n.proposal).map(n=>({id:n.id,route:WandererTalentRequirements.plan(graph,{},n.id)?.steps?.length}));
                return {original:original.length,proposedNodes:newNodes.length,total:graph.length,proposed,perFamily:Object.fromEntries(families.map(f=>[f,forks.filter(n=>n.family===f).length])),clearance,overlaps,outerRadius:Math.max(...forks.map(n=>Math.hypot(positions[n.id].x,positions[n.id].y)))};
              });
              assert.equal(metrics.original,367);assert.equal(metrics.total,415);assert.equal(metrics.proposedNodes,48);assert(Object.values(metrics.perFamily).every(n=>n===3));assert.deepEqual(metrics.overlaps,[]);assert(metrics.proposed.every(n=>Number.isInteger(n.route)));
              assert.equal(await page.evaluate(()=>WandererAutomaticTalents.NODES.length),367);
              await frame.locator('body').evaluate(async()=>{await document.fonts.ready;});
              await frame.getByRole('button',{name:'Full tree',exact:true}).click();
              await page.screenshot({path:path.join(out,'talent-tree-647d-full.png'),animations:'disabled',fullPage:true});
              await frame.getByRole('button',{name:'Radiance',exact:true}).click();
              await frame.locator('[data-id="proposal_vital_pulse"]').click();
              await page.screenshot({path:path.join(out,'talent-tree-647d-radiance.png'),animations:'disabled',fullPage:true});
              await frame.getByRole('button',{name:'Magic',exact:true}).click();
              await frame.locator('[data-id="proposal_arcane_nova"]').click();
              await page.screenshot({path:path.join(out,'talent-tree-647d-arcane.png'),animations:'disabled',fullPage:true});
              assert.equal(await page.evaluate(()=>WandererGame.snapshot().automaticTalents.nodes.length),0);
              const offline=await browser.newPage({viewport:{width:1600,height:900}});
              offline.on('pageerror',e=>errors.push(e.message));await offline.goto('file://'+path.join(out,'talent-tree-647d-interactive.html'),{waitUntil:'load'});
              await offline.locator('#nodes .node').first().waitFor();
              assert.equal(await offline.locator('#nodes .node').count(),415);
              assert.equal(await offline.locator('#nodes image').count(),6);
              assert(await offline.locator('#nodes image').evaluateAll(els=>els.every(el=>el.getAttribute('href').startsWith('data:image/png;base64,'))));
              await offline.getByRole('button',{name:'Decay',exact:true}).click();
              await offline.locator('[data-id="proposal_contagious_touch"]').click();
              assert((await offline.locator('#description').innerText()).includes('DESIGN CANDIDATE'));
              assert.deepEqual(errors,[]);
              fs.writeFileSync(path.join(out,'capture.json'),JSON.stringify({commit:process.env.GITHUB_SHA,metrics,errors},null,2));
              console.log('STAGE647D_LAYOUT='+JSON.stringify(metrics));
            }finally{await browser.close();await new Promise(r=>server.close(r));}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: talent-tree-647d-prototype
          path: |
            reports/stage647d-layout/talent-tree-647d-*.png
            reports/stage647d-layout/talent-tree-647d-interactive.html
            reports/stage647d-layout/capture.json
          if-no-files-found: error

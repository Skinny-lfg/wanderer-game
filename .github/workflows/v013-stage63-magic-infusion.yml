name: Wanderer v0.13 — Stage 6.3 Magic Infusion native integration
on:
  push:
    branches: [audit/v013-stage6]
    paths:
      - '.github/workflows/v013-stage63-magic-infusion.yml'
      - 'tests/v013-stage63-magic-runtime.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  magic-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Magic choice integration, hybrid triggers and combat regressions
        run: |
          node --test \
            tests/v013-stage63-magic-runtime.test.cjs \
            tests/talent-graph-combat.test.cjs \
            tests/talent-graph-runtime.test.cjs \
            tests/talent-graph-next.test.cjs \
            tests/v013-stage61-arcane-infusion.test.cjs \
            tests/v013-stage62-magic-attunement.test.cjs \
            tests/v013-offhand-dagger-any-main.test.cjs \
            tests/v013-offhand-stage2-gear.test.cjs \
            tests/v013-gravecaller-bound-souls.test.cjs
          git diff --check
      - name: Native E5/E35 Magic caster and physical matrix
        run: node scripts/v013-stage63-native-magic-matrix.cjs
      - name: Save native report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage63-native-magic-weapon-matrix
          path: |
            reports/stage63-native-magic-matrix.json
            reports/stage63-native-magic-matrix.md
          retention-days: 30
          if-no-files-found: warn

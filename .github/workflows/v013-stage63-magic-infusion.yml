name: Wanderer v0.13 — Stage 6.3 Magic Infusion native integration
on:
  push:
    branches: [audit/v013-stage6]
    paths:
      - '.github/workflows/v013-stage63-arcane-infusion.yml'
      - 'tests/v013-stage63-magic-runtime.test.cjs'
      - 'tests/talent-graph-combat.test.cjs'
      - 'combat/v012-combat-runtime.js'
      - 'combat/v012-buildcraft.js'
      - 'combat/talent-graph-next.js'
      - 'scripts/v013-stage63-native-magic-matrix.cjs'
      - 'scripts/v013-stage63-native-magic-comparison.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arcane-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - run: npm ci
      - name: Magic choice integration, hybrid triggers and combat regressions
        run: |
          node --test \
            tests/v013-stage63-magic-runtime.test.cjs \
            tests/v013-stage63-native-magic-comparison.test.cjs \
            tests/talent-graph-combat.test.cjs \
            tests/talent-graph-runtime.test.cjs \
            tests/talent-graph-next.test.cjs \
            tests/v013-stage61-arcane-infusion.test.cjs \
            tests/v013-stage62-magic-attunement.test.cjs \
            tests/v013-offhand-dagger-any-main.test.cjs \
            tests/v013-offhand-stage2-gear.test.cjs \
            tests/v013-gravecaller-bound-souls.test.cjs
          git diff --check
      - name: Matched E5/E35 Magic native baseline and new mechanics
        run: |
          git worktree add --detach "$RUNNER_TEMP/wanderer-before" 945a00c135c08253a1c8d8359b4b102e5296b4c4
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/wanderer-before/node_modules"
          STAGE63_NATIVE_ROOT="$RUNNER_TEMP/wanderer-before" STAGE63_REPORT_FILE=reports/stage63-native-arcane-baseline.json node scripts/v013-stage63-native-magic-matrix.cjs
          node scripts/v013-stage63-native-magic-matrix.cjs
          node scripts/v013-stage63-native-magic-comparison.cjs
      - name: Save native report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage63-native-arcane-weapon-matrix
          path: |
            reports/stage63-native-arcane-baseline.json
            reports/stage63-native-arcane-baseline.md
            reports/stage63-native-arcane-matrix.json
            reports/stage63-native-arcane-matrix.md
            reports/stage63-native-arcane-comparison.json
            reports/stage63-native-arcane-comparison.md
          retention-days: 30
          if-no-files-found: warn

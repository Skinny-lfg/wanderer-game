name: Anchor Decay Cycle vs Overflow Factorial (NO DEPLOY)
on:
  push:
    branches: [balance/stage-6.40-e1-calibration]
    paths: ['scripts/v013-anchor-decay-factorial.cjs','.github/workflows/v013-anchor-decay-factorial.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node scripts/v013-anchor-decay-factorial.cjs smoke
      - run: npm run test:v013:sim
  compare:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [twohand, staff, daggers, wand]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: node scripts/v013-anchor-decay-factorial.cjs ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: anchor-factorial-${{ matrix.profile }}
          path: reports/anchor-decay-factorial/*.json
  summary:
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: anchor-factorial-*
          path: reports/anchor-decay-factorial
          merge-multiple: true
      - run: node scripts/v013-anchor-decay-factorial.cjs aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: anchor-factorial-summary
          path: reports/anchor-decay-factorial/summary.json

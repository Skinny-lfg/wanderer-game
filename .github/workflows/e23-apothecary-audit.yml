name: E.2.3 Apothecary potion A-B audit
on:
  push:
    branches: [development]
    paths: [.github/workflows/e23-apothecary-audit.yml]
  workflow_dispatch:
jobs:
  potions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check scripts/v012-affinity-combat-sim.cjs
          node --check scripts/v012-phase-e23-apothecary-audit.cjs
      - name: Run 120 paired E200 potion runs
        run: node scripts/v012-phase-e23-apothecary-audit.cjs /tmp/wanderer-e23.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wanderer-e23-apothecary
          path: /tmp/wanderer-e23.json
          if-no-files-found: ignore

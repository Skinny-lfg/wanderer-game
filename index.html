/* Wanderer dark-crimson surface pass.
   Neutral navy remnants only: rarity, elemental, danger, success and HP colors
   deliberately keep their gameplay meaning. */
html{background:#1b0b13}
body{min-height:100vh;background:radial-gradient(ellipse 115% 82% at 48% -15%,#47212e 0%,#2d141f 43%,#1b0b13 85%) fixed}
:root{--bg:#1b0b13;--panel:#2c1a22;--panel2:#3b242d;--edge:#704a55;--muted:#c7afb7}
.panel{background:linear-gradient(145deg,#342027 0%,#25141d 85%);border-color:#6c4854}
button:not(.primary):not(.danger):not(.extractComplete){border-color:#71505c}

.nav button{background:linear-gradient(160deg,#422934,#2b1822)}

.token{background:#311c26;border-color:#72515a}
.paper{background:radial-gradient(ellipse at 50% 45%,#41302f,#211319 70%);border-color:#795a55}

.equipmentLoadout .paper .slotTile,
.equipmentLoadout .paper .slotTile:not(.filled){background:#291820ce;border-color:#74505d}
.equipmentLoadout .paper .slotTile:not(.filled){background:#24141bc2}

.stat,.statStrip .metric,.combatReadout,.combatAttributes span,.equipmentStats .stat,
.shopCard,.merchantCompactCard,.valuable,.stashGrid,.invItem,.stashCapacityBar,
.protectionPanel,.protectionChoice,.setItem,.log,.deathNumbers span,
.combatRuneReadout,.runeSlot,.runePanel,.combatLoot,.combatExpeditionDetails,

 background:#281820;border-color:#6c4a55;

/* Responsive site artwork v0.10.0: original optimized 16:9 WebP backgrounds. */
/* Fixed viewport artwork for every tab (including inventory).
   The viewport pseudo-layer stays motionless during document and stash scrolling,
   unlike body backgrounds on tall pages or mobile browsers. */
body{isolation:isolate;background:transparent}
body::before{
 content:'';
 position:fixed;
 inset:0;
 z-index:-1;
 pointer-events:none;
 background-color:#1b0b13;
 background-image:linear-gradient(180deg,rgba(20,8,14,.56),rgba(15,6,12,.78)),url('assets/backgrounds/dungeon-desktop.webp');
 background-size:cover,cover;
 background-position:center,center;
 background-repeat:no-repeat,no-repeat;
}
@media(max-width:650px){
 body::before{
  background-image:linear-gradient(180deg,rgba(20,8,14,.61),rgba(15,6,12,.82)),url('assets/backgrounds/dungeon-mobile.webp');
 }
}

.tavernArt{background-image:url('assets/backgrounds/tavern-desktop.webp');background-size:cover;background-position:center}
.scene{background-image:url('assets/backgrounds/dungeon-desktop.webp');background-size:cover;background-position:center}
@media(max-width:650px){
 .tavernArt{background-image:url('assets/backgrounds/tavern-mobile.webp');background-position:center}
 .scene{background-image:url('assets/backgrounds/dungeon-mobile.webp');background-position:center}
}

function estimateEnemy(level,n=1){
 const boss=n===5&&level%10===0;
 const base={hp:27+level*14,atk:4+level*3,def:1+level*.62};
 if(boss)return {hp:Math.round(base.hp*1.38),atk:Math.round(base.atk*1.28),def:Math.round(base.def)};
 const stage=Math.max(1,Math.min(4,n));
 const hpFactor=[1,1.12,1.24,1.48][stage-1],atkFactor=[1,1.08,1.16,1.25][stage-1],defFactor=[1,1.06,1.12,1.22][stage-1];
 return {hp:Math.round(Math.round(base.hp*1.4)*1.4*hpFactor),atk:Math.round(Math.round(base.atk*1.25)*1.4*atkFactor),def:Math.round(Math.round(base.def*1.2)*1.4*defFactor)};
}
// Predict the whole dungeon instead of comparing a single attack stat to wave one.
function dungeonDifficulty(level,stats=totalStats()){
 // Preview only: model the same HP, defense and attack timings as combat.
 // Estimate all encounters, not just the first mob. Real encounters vary
 // by elite archetype, affinity, procs, sustain and player decisions.
 const waves=wavesForDungeon(level),health=Math.max(1,stats.maxhp||1);
 const speed=Math.max(.25,stats.attacksPerSec||1),crit=1+Math.min(65,stats.crit||0)/200;
 const subtype=stats.main?.subtype||'Sword',caster=!!stats.caster;
 const physicalFactor=({'Two-Handed':1.70,Mace:1.4,Bow:1.08,Daggers:.72,Staff:.55,Wand:.55})[subtype]||1;
 const magicFactor=subtype==='Staff'?1.32:.77,castCost=subtype==='Staff'?13:9;
 const regen=stats.bonus?.regenBonus?regenPerSecond(health):0;
 let expectedLoss=0,largestHit=0;
 for(let n=1;n<=waves;n++){
  const enemy=estimateEnemy(level,n),boss=n===5,elite=n===4;
  // Bosses double the generated stats; elites have different HP/attack tradeoffs.
  const enemyHp=enemy.hp*(boss?2:elite?1.18:1.01)+(boss?level*.9:elite?level*.2:0);
  const enemyAtk=enemy.atk*(boss?2:elite?1.04:1.02);
  const enemyDef=enemy.def*(boss?2:elite?1.03:1);
  const physicalHit=Math.max(1,Math.round((stats.attack||1)*physicalFactor)-Math.round(enemyDef));
  const magicHit=Math.max(1,Math.round((stats.spellPower||1)*magicFactor));
  // Mana is persistent across waves. A caster cannot cast every swing indefinitely.
  const castShare=caster?Math.min(1,Math.max(.25,((stats.mana||0)/(waves*7)+(stats.manaRegen||0))/(castCost*speed))):0;
  const perHit=caster?magicHit*castShare+physicalHit*(1-castShare):physicalHit;
  const procBonus=stats.sets?.length?1.15:1.05;
  const offhandBonus=stats.off?.subtype==='Off-Hand Dagger'?1.08:1;
  const dps=Math.max(.5,perHit*speed*crit*procBonus*offhandBonus);
  const killSeconds=enemyHp/dps;
  const rawHit=Math.max(Math.ceil(enemyAtk*.24),Math.round(enemyAtk*(1-Math.min(.75,(stats.defense||0)/((stats.defense||0)+enemyAtk*1.35)))));
  const blocked=(stats.blockChance||0)/100*(stats.blockReduction||0);
  const hit=rawHit*(1-blocked);
  const interval=boss?1.62:elite?1.65:1.55;
  const attacksTaken=Math.max(0,killSeconds/interval-.45);
  // Damage from one boss strike can still be dangerous even for high-sustain builds.
  largestHit=Math.max(largestHit,elite?Math.min(hit,health*.35):hit);
  expectedLoss+=Math.max(0,attacksTaken*hit-killSeconds*regen);
 }
 const pressure=expectedLoss/health,spike=largestHit/health;
 const label=spike>=.80||pressure>=1.9?'Brutal':
   spike>=.52||pressure>=1.18?'Hard':
   spike>=.34||pressure>=.74?'Challenging':
   spike>=.22||pressure>=.38?'Favorable':'Easy';
 return {label,css:'risk'+label};
}

function synchronizeDots(enemy){
 if(!enemy.dots)return;
 for(const key of ['poison','bleed','burn']){
 const active=enemy.dots[key]||[];
 enemy[key]=active.reduce((sum,d)=>sum+d.damage,0);
 enemy[key+'Stacks']=active.length;
 }
}
function tickDots(enemy){
 if(!enemy.dots)return 0;
 let total=0;
 for(const key of ['poison','bleed','burn']){
 const active=enemy.dots[key]||[];
 for(const d of active){total+=d.damage;d.remaining-=1;}
 enemy.dots[key]=active.filter(d=>d.remaining>0);
 }
 synchronizeDots(enemy);
 return total;
}

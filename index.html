  const legacy=ICONS[key==='dagger'?'daggers':key];
  const options=[
    ...(LEGACY_ICON_TYPES.has(key)&&legacy?[legacy]:[]),
    ...names.map(name=>EQUIPMENT_ICON_ROOT+name)
  ];
  // Stable per item ID. No save migration, no re-roll on every render.
  if(o.name==='Training Sword'&&key==='sword'&&legacy)return placeholderIcon('Sword');
  const seed=String(o.id||o.name||o.subtype||key);
  let hash=2166136261;
  for(let i=0;i<seed.length;i++)hash=Math.imul(hash^seed.charCodeAt(i),16777619);

}

function phase6PassiveCard(p,attribute){
 const rank=WandererV012Buildcraft.ownedRank(phase1Build,p.id),category=p.category||'Passive';
 const preview=WandererV012Buildcraft.preview(phase1Build,p.id,phase2Stats());
 const labels={chance:'Chance',bleed:'Bleed',bleedBonus:'Bleed bonus',burst:'Bonus damage',enemyCap:'Enemy HP cap',threshold:'Threshold',hp:'Max HP',base:'Base damage',rot:'Rot',rotBonus:'Rot bonus',reduction:'Damage reduction',healingReduction:'Healing reduction',maxhp:'Max HP',heal:'Healing',defense:'Defense',block:'Block',barrier:'Barrier',speed:'Attack speed',crit:'Critical chance',power:'Power',regen:'Regeneration',burn:'Burn',cost:'Mana cost',normalCap:'Normal enemy cap',bossCap:'Boss cap',mana:'Mana',duration:'Duration',icd:'Cooldown',uses:'Uses',hits:'Hits',charges:'Charges'};
 const flat=new Set(['block','crit','cost','mana','duration','icd','uses','hits','charges']);
 const value=(key,n)=>flat.has(key)?`${Number(n.toFixed(2))}${['duration','icd'].includes(key)?'s':''}`:`${Number((n*100).toFixed(2))}%`;
 const changes=Object.entries(preview.after).filter(([key,n])=>Number.isFinite(n)&&n!==preview.before[key]).map(([key,n])=>{const tone=/^bleed/.test(key)?'bleed':/^rot/.test(key)?'rot':/^(?:barrier|block)/.test(key)?'barrier':/^(?:heal|regen)$/.test(key)?'heal':'';return '<span class="phase3PassivePreviewEntry'+(tone?' phase3PassivePreviewEntry--'+tone:'')+'">'+esc(labels[key]||'Effect')+': '+(rank&&Number.isFinite(preview.before[key])?esc(value(key,preview.before[key]))+' → ':'')+'<b class="'+(n>Number(preview.before[key]||0)?'phase3PassiveIncrease':'phase3PassiveValue')+'">'+esc(value(key,n))+'</b></span>';});
 const description=String(p.description).replace(/\bICD\b/gi,'cooldown').replace(/\bbounded\b/gi,'limited');
 return '<article class="phase3PassiveCard"><button type="button" class="phase1DraftCard phase3PassiveChoice" '+attribute+'="'+esc(p.id)+'">'+phase2PassiveIcons(p,false)+'<strong>'+esc(p.name)+'</strong><span class="phase3PassiveAffinity '+(p.requires?.length?'phase3PassiveHybrid':'')+'">'+esc(p.requires?.length?'HYBRID · '+p.requires.map(f=>WandererV012Expedition.FAMILY_NAMES[f]||f).join(' + '):(WandererV012Expedition.FAMILY_NAMES[p.family]||p.family))+'</span><span class="phase3PassiveType">'+esc(category)+'</span><span class="phase3PassiveDescription">'+phase3PassiveDescriptionHtml(description)+'</span>'+(changes.length?'<span class="phase3PassivePreview">'+changes.join('<span class="phase3PassiveSeparator"> · </span>')+'</span>':'')+'<span class="phase3PassiveRank">'+(p.max===1?'Unique':`Rank ${rank} → ${rank+1}/${p.max}`)+'</span></button></article>';
}
